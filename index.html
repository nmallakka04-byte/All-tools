<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090f">
<title>Aurora AI — Business Suite</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf@2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable@3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://unpkg.com/tesseract.js@v6.0.0/dist/tesseract.min.js"></script>
<style>
:root {
  --bg-0: #08090f; --bg-1: #0d0f18; --bg-2: #131623; --bg-3: #1c2030;
  --line: rgba(255,255,255,.06); --line-2: rgba(255,255,255,.1);
  --text: #eef0f8; --text-2: #9ba0b8; --text-3: #5c6180;
  --violet: #7c5cff; --violet-2: #9b7fff; --violet-glow: rgba(124,92,255,.4);
  --emerald: #10d97a; --rose: #ff4f6e; --amber: #ffb547; --cyan: #22d3ee; --pink: #f472b6;
  --r-sm: 8px; --r: 14px; --r-lg: 20px;
  --shadow-lg: 0 20px 60px -20px rgba(0,0,0,.8);
  --transition: cubic-bezier(.4,.2,.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html { font-size:16px; -webkit-font-smoothing:antialiased }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-0); color: var(--text); min-height: 100vh; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% -10%, rgba(124,92,255,.18), transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 10%, rgba(34,211,238,.08), transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 100%, rgba(244,114,182,.06), transparent 70%);
}
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; position: relative; z-index: 1 }
.side {
  background: rgba(13,15,24,.8); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-right: 1px solid var(--line); padding: 22px 0;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column;
}
.side::-webkit-scrollbar { width: 0 }
.brand { padding: 0 22px 22px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--violet), var(--pink));
  display: grid; place-items: center; font-size: 17px;
  box-shadow: 0 8px 24px -8px var(--violet-glow); flex-shrink: 0;
  position: relative;
}
.brand-mark::after {
  content: 'AI'; position: absolute; bottom: -4px; right: -4px;
  background: var(--bg-1); border: 1px solid var(--violet);
  border-radius: 4px; font-size: 7px; font-weight: 800; color: var(--violet-2);
  padding: 1px 3px; letter-spacing: .5px;
}
.brand-text h1 {
  font-size: 15px; font-weight: 700; letter-spacing: -.3px;
  background: linear-gradient(135deg, #fff, #9ba0b8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-text p { font-size: 10px; color: var(--text-3); letter-spacing: .5px; text-transform: uppercase; margin-top: 1px }
.nav-label { padding: 12px 22px 6px; font-size: 10px; font-weight: 700; color: var(--text-3); letter-spacing: 1.2px; text-transform: uppercase }
.nav-link {
  display: flex; align-items: center; gap: 12px; padding: 9px 22px;
  font-size: 13px; font-weight: 500; color: var(--text-2);
  cursor: pointer; transition: all .18s var(--transition); position: relative;
  border: none; background: none; width: 100%; text-align: left; font-family: inherit;
}
.nav-link::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%) scaleY(0);
  width: 3px; height: 20px; background: linear-gradient(180deg, var(--violet), var(--pink));
  border-radius: 0 3px 3px 0; transition: transform .2s var(--transition);
}
.nav-link:hover { color: var(--text); background: rgba(255,255,255,.03) }
.nav-link.on { color: var(--text); background: linear-gradient(90deg, rgba(124,92,255,.12), transparent 80%) }
.nav-link.on::before { transform: translateY(-50%) scaleY(1) }
.nav-link .ic { font-size: 15px; width: 18px; display: inline-flex; justify-content: center; opacity: .8 }
.nav-link.on .ic { opacity: 1 }
.nav-link .ai-badge {
  margin-left: auto; font-size: 8px; font-weight: 800; padding: 2px 5px;
  border-radius: 4px; background: linear-gradient(135deg, var(--violet), var(--pink));
  color: #fff; letter-spacing: .5px;
}
.side-foot { margin-top: auto; padding: 14px 22px 0; border-top: 1px solid var(--line); font-size: 10px; color: var(--text-3); letter-spacing: .3px }
.main { min-width: 0; display: flex; flex-direction: column }
.top {
  display: flex; align-items: center; gap: 14px; padding: 18px 28px;
  border-bottom: 1px solid var(--line); background: rgba(13,15,24,.6);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 20;
}
.menu { display: none; width: 34px; height: 34px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--text); font-size: 15px; cursor: pointer; align-items: center; justify-content: center }
.crumb { flex: 1; min-width: 0 }
.crumb h2 { font-size: 17px; font-weight: 700; letter-spacing: -.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.crumb p { font-size: 11px; color: var(--text-3); margin-top: 1px }
.cta {
  padding: 9px 16px; background: linear-gradient(135deg, var(--violet), #6a4aff);
  color: #fff; border: none; border-radius: var(--r-sm); font-size: 12px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all .2s var(--transition);
  box-shadow: 0 8px 20px -6px var(--violet-glow); letter-spacing: .2px;
}
.cta:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -8px var(--violet-glow) }
.cta-ai {
  background: linear-gradient(135deg, var(--cyan), var(--violet));
  display: inline-flex; align-items: center; gap: 6px;
}
.icon-btn { width: 34px; height: 34px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--text-2); cursor: pointer; font-size: 14px; transition: all .18s var(--transition); display: grid; place-items: center }
.icon-btn:hover { background: var(--bg-3); color: var(--text); border-color: var(--line-2) }
.stage { padding: 24px 28px 40px; flex: 1 }
.grid { display: grid; gap: 14px; margin-bottom: 20px }
.kpi-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) }
.kpi {
  background: linear-gradient(180deg, rgba(28,32,48,.6), rgba(19,22,35,.6));
  border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px;
  position: relative; overflow: hidden; transition: border-color .2s var(--transition);
}
.kpi:hover { border-color: var(--line-2) }
.kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(124,92,255,.5), transparent); opacity: 0; transition: opacity .3s }
.kpi:hover::before { opacity: 1 }
.kpi.ai::after {
  content: 'AI'; position: absolute; top: 12px; right: 12px; font-size: 8px; font-weight: 800;
  padding: 2px 5px; border-radius: 4px; background: linear-gradient(135deg, var(--cyan), var(--violet));
  color: #fff; letter-spacing: .5px;
}
.kpi-label { font-size: 10px; font-weight: 700; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 6px }
.kpi-label .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block }
.kpi-value { font-size: 22px; font-weight: 700; margin-top: 8px; letter-spacing: -.6px; font-variant-numeric: tabular-nums; line-height: 1.1 }
.kpi-note { font-size: 11px; color: var(--text-3); margin-top: 4px }
.dot-violet { background: var(--violet); box-shadow: 0 0 8px var(--violet-glow) }
.dot-emerald { background: var(--emerald); box-shadow: 0 0 8px rgba(16,217,122,.5) }
.dot-rose { background: var(--rose); box-shadow: 0 0 8px rgba(255,79,110,.5) }
.dot-amber { background: var(--amber); box-shadow: 0 0 8px rgba(255,181,71,.5) }
.dot-cyan { background: var(--cyan); box-shadow: 0 0 8px rgba(34,211,238,.5) }
.dot-pink { background: var(--pink); box-shadow: 0 0 8px rgba(244,114,182,.5) }
.violet { color: var(--violet-2) } .emerald { color: var(--emerald) }
.rose { color: var(--rose) } .amber { color: var(--amber) }
.cyan { color: var(--cyan) } .pink { color: var(--pink) }
.panel { background: rgba(19,22,35,.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; margin-bottom: 16px }
.panel.ai-panel { border-color: rgba(34,211,238,.2); background: linear-gradient(180deg, rgba(34,211,238,.04), rgba(124,92,255,.04)) }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap }
.panel-head h3 { font-size: 14px; font-weight: 700; letter-spacing: -.2px; display: flex; align-items: center; gap: 8px }
.panel-head .sub { font-size: 11px; color: var(--text-3); font-weight: 500 }
.panel-actions { display: flex; gap: 8px }
.ai-icon { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #fff; letter-spacing: .5px }
.tbl-scroll { overflow-x: auto; margin: 0 -22px; padding: 0 22px }
.tbl-scroll::-webkit-scrollbar { height: 6px }
.tbl-scroll::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px }
table.data th { text-align: left; padding: 11px 12px; font-size: 10px; font-weight: 700; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--line); white-space: nowrap }
table.data td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: middle }
table.data tbody tr { transition: background .15s var(--transition) }
table.data tbody tr:hover { background: rgba(255,255,255,.02) }
table.data tbody tr:last-child td { border-bottom: none }
table.data .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500 }
table.data .name { font-weight: 600; color: var(--text) }
table.data .sm { font-size: 11px; color: var(--text-3); margin-top: 2px; font-weight: 400 }
.row-btns { display: flex; gap: 4px; justify-content: flex-end }
.row-btn { width: 28px; height: 28px; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--text-3); cursor: pointer; font-size: 12px; transition: all .15s var(--transition); display: grid; place-items: center }
.row-btn:hover { background: var(--bg-2); color: var(--text); border-color: var(--line-2) }
.row-btn.danger:hover { color: var(--rose); border-color: rgba(255,79,110,.3) }
.row-btn.ai:hover { color: var(--cyan); border-color: rgba(34,211,238,.4) }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase }
.pill::before { content: ''; width: 5px; height: 5px; border-radius: 50% }
.pill.ok { background: rgba(16,217,122,.12); color: var(--emerald) } .pill.ok::before { background: var(--emerald); box-shadow: 0 0 6px var(--emerald) }
.pill.warn { background: rgba(255,181,71,.12); color: var(--amber) } .pill.warn::before { background: var(--amber); box-shadow: 0 0 6px var(--amber) }
.pill.err { background: rgba(255,79,110,.12); color: var(--rose) } .pill.err::before { background: var(--rose); box-shadow: 0 0 6px var(--rose) }
.pill.info { background: rgba(124,92,255,.12); color: var(--violet-2) } .pill.info::before { background: var(--violet); box-shadow: 0 0 6px var(--violet) }
.pill.none { background: rgba(155,160,184,.1); color: var(--text-3) } .pill.none::before { background: var(--text-3) }
.empty { text-align: center; padding: 50px 20px; color: var(--text-3); font-size: 13px }
.empty-icon { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px; background: linear-gradient(135deg, rgba(124,92,255,.15), rgba(244,114,182,.1)); border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 24px; opacity: .8 }
.empty-title { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 4px }
.empty-note { font-size: 12px; max-width: 300px; margin: 0 auto; line-height: 1.6 }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px }
.field label { font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: .3px }
.field label .req { color: var(--rose) }
.field input, .field select, .field textarea { width: 100%; padding: 10px 13px; background: rgba(8,9,15,.6); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: all .18s var(--transition) }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-glow) }
.field textarea { min-height: 74px; resize: vertical }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.field-row.three { grid-template-columns: 1fr 1fr 1fr }
.btn { padding: 10px 18px; border: none; border-radius: var(--r-sm); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .18s var(--transition); letter-spacing: .2px }
.btn-primary { background: linear-gradient(135deg, var(--violet), #6a4aff); color: #fff; box-shadow: 0 8px 20px -6px var(--violet-glow) }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -8px var(--violet-glow) }
.btn-success { background: linear-gradient(135deg, var(--emerald), #0bb566); color: #fff; box-shadow: 0 8px 20px -6px rgba(16,217,122,.4) }
.btn-ghost { background: rgba(255,255,255,.04); color: var(--text-2); border: 1px solid var(--line) }
.btn-ghost:hover { background: rgba(255,255,255,.08); color: var(--text); border-color: var(--line-2) }
.btn-danger { background: rgba(255,79,110,.1); color: var(--rose); border: 1px solid rgba(255,79,110,.2) }
.btn-danger:hover { background: rgba(255,79,110,.15) }
.btn-ai { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #fff; box-shadow: 0 8px 20px -6px rgba(34,211,238,.4) }
.btn-ai:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -8px rgba(34,211,238,.5) }
.btn-sm { padding: 7px 12px; font-size: 12px }
.btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap }
.modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(4,5,10,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; align-items: flex-start; justify-content: center; padding: 24px; overflow-y: auto }
.modal-bg.on { display: flex; animation: fadeIn .2s var(--transition) }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.modal { background: linear-gradient(180deg, rgba(28,32,48,.98), rgba(19,22,35,.98)); border: 1px solid var(--line-2); border-radius: var(--r-lg); width: 100%; max-width: 620px; box-shadow: var(--shadow-lg); margin: auto; animation: slideUp .28s var(--transition); overflow: hidden }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px) scale(.98) } to { opacity: 1; transform: none } }
.modal-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between }
.modal-head h3 { font-size: 15px; font-weight: 700; letter-spacing: -.3px; display: flex; align-items: center; gap: 8px }
.modal-head .x { width: 30px; height: 30px; background: transparent; border: none; color: var(--text-3); font-size: 20px; cursor: pointer; border-radius: 6px; transition: all .15s; line-height: 1 }
.modal-head .x:hover { background: var(--bg-2); color: var(--text) }
.modal-body { padding: 22px }
.modal-foot { padding: 16px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 80px); background: linear-gradient(135deg, rgba(28,32,48,.98), rgba(19,22,35,.98)); border: 1px solid var(--line-2); color: var(--text); padding: 12px 22px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 200; transition: transform .3s var(--transition); box-shadow: var(--shadow-lg); pointer-events: none; max-width: 90vw }
.toast.on { transform: translate(-50%, 0) }
.toast.err { border-color: rgba(255,79,110,.3); color: var(--rose) }
.toast.ok { border-color: rgba(16,217,122,.3); color: var(--emerald) }
.toast.ai { border-color: rgba(34,211,238,.4); color: var(--cyan) }
.chart-wrap { position: relative; height: 240px; margin: 6px 0 }
.line-items { display: flex; flex-direction: column; gap: 6px }
.line { display: grid; grid-template-columns: 2fr 60px 90px 65px 30px; gap: 6px; align-items: center }
.line input, .line select { padding: 8px 10px; background: rgba(8,9,15,.6); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 12px; font-family: inherit; outline: none; width: 100%; transition: border-color .15s }
.line input:focus, .line select:focus { border-color: var(--violet) }
.line .rm { width: 30px; height: 30px; background: transparent; border: none; color: var(--text-3); cursor: pointer; border-radius: 6px; font-size: 13px; transition: all .15s }
.line .rm:hover { background: rgba(255,79,110,.1); color: var(--rose) }
.totals { margin-top: 16px; padding: 16px 18px; background: rgba(8,9,15,.5); border: 1px solid var(--line); border-radius: var(--r); font-size: 13px }
.totals-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; color: var(--text-2) }
.totals-row b { color: var(--text); font-variant-numeric: tabular-nums }
.totals-grand { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 0; margin-top: 8px; border-top: 1px solid var(--line-2); font-size: 17px; font-weight: 700; letter-spacing: -.3px }
.thermal { background: #fff; color: #000; padding: 14px 16px; font-family: 'Courier New', ui-monospace, monospace; font-size: 11px; line-height: 1.5; max-width: 300px; margin: 0 auto; border-radius: 4px }
.thermal .center { text-align: center }
.thermal .biz { font-size: 13px; font-weight: 700 }
.thermal hr { border: none; border-top: 1px dashed #999; margin: 6px 0 }
.thermal table { width: 100%; font-size: 10px; border-collapse: collapse }
.thermal table td { padding: 1px 0; vertical-align: top }
.thermal .grand { font-size: 13px; font-weight: 700; padding-top: 4px; border-top: 1px solid #000 }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr }
  .side { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; z-index: 60; transform: translateX(-100%); transition: transform .3s var(--transition) }
  .side.on { transform: translateX(0) }
  .menu { display: flex }
  .stage { padding: 18px 16px 40px }
  .top { padding: 14px 16px }
  .crumb h2 { font-size: 15px }
  .field-row, .field-row.three { grid-template-columns: 1fr }
  .modal { max-width: 100% }
  .modal-bg { padding: 12px }
  .panel { padding: 16px }
  .tbl-scroll { margin: 0 -16px; padding: 0 16px }
  .line { grid-template-columns: 2fr 50px 70px 55px 28px; gap: 4px }
  .line input, .line select { padding: 7px 8px; font-size: 11px }
}
.overlay { position: fixed; inset: 0; background: rgba(4,5,10,.5); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .3s }
.overlay.on { opacity: 1; pointer-events: auto }

/* AI-specific */
.ai-insight {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
  background: rgba(8,9,15,.5); border: 1px solid var(--line);
  border-radius: var(--r); margin-bottom: 10px;
  border-left: 3px solid var(--violet);
  transition: border-color .2s;
}
.ai-insight:hover { border-color: var(--line-2); border-left-color: var(--cyan) }
.ai-insight.critical { border-left-color: var(--rose) }
.ai-insight.warning { border-left-color: var(--amber) }
.ai-insight.success { border-left-color: var(--emerald) }
.ai-insight .ic { font-size: 20px; flex-shrink: 0; line-height: 1 }
.ai-insight .body { flex: 1; min-width: 0 }
.ai-insight .body .title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px }
.ai-insight .body .desc { font-size: 12px; color: var(--text-2); line-height: 1.5 }
.ai-insight .body .meta { font-size: 10px; color: var(--text-3); margin-top: 4px; letter-spacing: .3px }

.ai-loading {
  display: flex; align-items: center; gap: 10px; padding: 30px;
  justify-content: center; color: var(--cyan); font-size: 13px;
}
.ai-loading .spinner {
  width: 16px; height: 16px; border: 2px solid rgba(34,211,238,.2);
  border-top-color: var(--cyan); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

.ai-suggest {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; background: rgba(34,211,238,.08);
  border: 1px dashed rgba(34,211,238,.3); border-radius: 30px;
  font-size: 12px; color: var(--cyan); cursor: pointer;
  transition: all .18s; margin: 4px 4px 0 0;
}

<script>
/* ═════════════════════════════════════════════════
   AURORA AI — Business Suite
   ═════════════════════════════════════════════════ */

const STATE = {
  customers: [], vendors: [], items: [],
  invoices: [], estimates: [], expenses: [], bills: [],
  config: {
    bizName: 'My Business', gstin: '', address: '', phone: '', email: '',
    stateCode: '27', currency: '₹', invPrefix: 'INV-', invCounter: 1,
    estPrefix: 'EST-', estCounter: 1
  }
};

/* ═════════════════════════════════════════════════
   AI ENGINE — Pure JS, runs locally
   ═════════════════════════════════════════════════ */
const AI = {
  // 1. Fuzzy string similarity (Levenshtein-based)
  similarity(a, b) {
    a = (a || '').toLowerCase().trim();
    b = (b || '').toLowerCase().trim();
    if (!a || !b) return 0;
    if (a === b) return 1;
    const longer = a.length > b.length ? a : b;
    const shorter = a.length > b.length ? b : a;
    if (longer.includes(shorter)) return shorter.length / longer.length;
    const costs = [];
    for (let i = 0; i <= shorter.length; i++) {
      let last = i;
      for (let j = 0; j <= longer.length; j++) {
        if (i === 0) costs[j] = j;
        else if (j === 0) costs[j] = i;
        else {
          const cur = costs[j];
          costs[j] = shorter[i-1] === longer[j-1]
            ? last
            : 1 + Math.min(last, costs[j-1], costs[j]);
          last = cur;
        }
      }
    }
    return 1 - costs[longer.length] / longer.length;
  },

  // 2. Linear regression forecast
  forecast(values, periods = 3) {
    const n = values.length;
    if (n < 2) return Array(periods).fill(values[0] || 0);
    let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
    for (let i = 0; i < n; i++) {
      sumX += i; sumY += values[i];
      sumXY += i * values[i]; sumX2 += i * i;
    }
    const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX || 1);
    const intercept = (sumY - slope * sumX) / n;
    const result = [];
    for (let i = 0; i < periods; i++) {
      result.push(Math.max(0, slope * (n + i) + intercept));
    }
    return result;
  },

  // 3. Anomaly detection (Z-score)
  detectAnomalies(values, threshold = 2) {
    if (values.length < 3) return [];
    const mean = values.reduce((a, b) => a + b, 0) / values.length;
    const variance = values.reduce((s, v) => s + Math.pow(v - mean, 2), 0) / values.length;
    const std = Math.sqrt(variance);
    if (std === 0) return [];
    return values.map((v, i) => ({
      index: i, value: v, zScore: (v - mean) / std,
      isAnomaly: Math.abs((v - mean) / std) > threshold
    })).filter(x => x.isAnomaly);
  },

  // 4. Auto-categorize expense based on description keywords
  categorizeExpense(description) {
    const text = (description || '').toLowerCase();
    const rules = {
      'Rent': ['rent', 'lease', 'office space', 'workspace'],
      'Utilities': ['electricity', 'water', 'gas bill', 'internet', 'broadband', 'wifi', 'phone bill', 'mobile bill'],
      'Salaries': ['salary', 'salaries', 'payroll', 'wages', 'staff pay'],
      'Marketing': ['ad', 'ads', 'marketing', 'facebook', 'google ads', 'instagram', 'promo', 'campaign'],
      'Travel': ['travel', 'flight', 'train', 'taxi', 'uber', 'ola', 'cab', 'hotel', 'stay'],
      'Software': ['saas', 'software', 'subscription', 'aws', 'azure', 'google cloud', 'notion', 'slack', 'zoom'],
      'Office Supplies': ['stationery', 'paper', 'pen', 'printer', 'ink', 'cartridge'],
      'Professional Fees': ['lawyer', 'legal', 'chartered', 'ca fee', 'audit', 'consultant', 'advisor'],
      'Maintenance': ['repair', 'maintenance', 'service', 'fix', 'amc'],
      'Insurance': ['insurance', 'policy', 'premium']
    };
    for (const [cat, keywords] of Object.entries(rules)) {
      if (keywords.some(k => text.includes(k))) return { category: cat, confidence: 0.9 };
    }
    return { category: 'Other', confidence: 0.3 };
  },

  // 5. Predict next payment amount from customer history
  predictCustomerValue(customerId, invoices) {
    const custInvoices = invoices.filter(i => i.customerId === customerId);
    if (!custInvoices.length) return { avg: 0, total: 0, count: 0 };
    const amounts = custInvoices.map(i => i.total);
    const total = amounts.reduce((a, b) => a + b, 0);
    return { avg: total / amounts.length, total, count: amounts.length, last: amounts[amounts.length - 1] };
  },

  // 6. Churn risk — customers who haven't ordered recently
  churnRisk(thresholdDays = 60) {
    const now = Date.now();
    const risky = [];
    STATE.customers.forEach(c => {
      const custInv = STATE.invoices.filter(i => i.customerId === c.id);
      if (!custInv.length) return;
      const lastDate = new Date(Math.max(...custInv.map(i => new Date(i.date).getTime())));
      const days = Math.floor((now - lastDate) / 86400000);
      const totalSpent = custInv.reduce((s, i) => s + i.total, 0);
      if (days > thresholdDays && totalSpent > 0) {
        risky.push({ customer: c, daysSince: days, totalSpent, invoiceCount: custInv.length });
      }
    });
    return risky.sort((a, b) => b.totalSpent - a.totalSpent);
  },

  // 7. Duplicate detection
  findDuplicates() {
    const dupCustomers = [];
    for (let i = 0; i < STATE.customers.length; i++) {
      for (let j = i + 1; j < STATE.customers.length; j++) {
        const sim = AI.similarity(STATE.customers[i].name, STATE.customers[j].name);
        if (sim > 0.85) {
          dupCustomers.push({ a: STATE.customers[i], b: STATE.customers[j], score: sim });
        }
      }
    }
    const dupItems = [];
    for (let i = 0; i < STATE.items.length; i++) {
      for (let j = i + 1; j < STATE.items.length; j++) {
        const sim = AI.similarity(STATE.items[i].name, STATE.items[j].name);
        if (sim > 0.85) {
          dupItems.push({ a: STATE.items[i], b: STATE.items[j], score: sim });
        }
      }
    }
    return { customers: dupCustomers, items: dupItems };
  },

  // 8. Natural language invoice parser
  parseNaturalInvoice(text) {
    if (!text) return null;
    const t = text.trim();
    const result = { customer: null, items: [], date: null, notes: '' };

    // Match customer name (look for existing customer substring)
    for (const c of STATE.customers) {
      if (t.toLowerCase().includes(c.name.toLowerCase())) {
        result.customer = c;
        break;
      }
    }

    // Match items with pattern "N x ItemName at Rate" or "N ItemName @ Rate"
    const itemRegex = /(\d+(?:\.\d+)?)\s*(?:x|×|of|units? of)?\s+([A-Za-z][A-Za-z0-9 _-]{1,40}?)\s*(?:at|@|for|rate)\s*(?:₹|rs\.?|inr|\$)?\s*(\d+(?:\.\d+)?)/gi;
    let match;
    while ((match = itemRegex.exec(t)) !== null) {
      const qty = parseFloat(match[1]);
      const name = match[2].trim();
      const rate = parseFloat(match[3]);
      // Try to find matching item in catalog
      const foundItem = STATE.items.find(i =>
        AI.similarity(i.name, name) > 0.7
      );
      result.items.push({
        itemId: foundItem?.id || '',
        name: foundItem?.name || name,
        qty, rate,
        gst: foundItem?.gst ?? 18
      });
    }

    // Match date
    const dateRegex = /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/;
    const dm = t.match(dateRegex);
    if (dm) {
      let [, d, m, y] = dm;
      if (y.length === 2) y = '20' + y;
      result.date = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }

    return result;
  },

  // 9. Smart reorder recommendations based on stock + velocity
  reorderRecommendations() {
    const recs = [];
    STATE.items.forEach(it => {
      const stock = Number(it.stock) || 0;
      const sold = STATE.invoices
        .flatMap(i => i.items || [])
        .filter(li => li.itemId === it.id)
        .reduce((s, li) => s + li.qty, 0);
      const velocity = sold / Math.max(1, STATE.invoices.length ? 30 : 1);
      if (stock <= 5 && velocity > 0) {
        recs.push({ item: it, stock, velocity, suggested: Math.ceil(velocity * 30) });
      }
    });
    return recs.sort((a, b) => b.velocity - a.velocity);
  },

  // 10. Payment collection priority — which customers to chase
  paymentPriorities() {
    const now = Date.now();
    const items = [];
    STATE.invoices.forEach(inv => {
      const bal = inv.total - (inv.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0);
      if (bal <= 0) return;
      const days = Math.floor((now - new Date(inv.date)) / 86400000);
      const priority = (bal / 1000) + (days / 10);
      items.push({
        invoice: inv, balance: bal, daysOverdue: days, priority,
        customerName: inv.customerName
      });
    });
    return items.sort((a, b) => b.priority - a.priority);
  }
};

/* ═════════════════════════════════════════════════
   Storage (IndexedDB)
   ═════════════════════════════════════════════════ */
let _db = null;
function idb() {
  return new Promise((ok, err) => {
    const r = indexedDB.open('aurora_ai', 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore('s');
    r.onsuccess = e => ok(e.target.result);
    r.onerror = e => err(e.target.error);
  });
}
async function load() {
  try {
    _db = await idb();
    return new Promise(ok => {
      const t = _db.transaction('s', 'readonly');
      const r = t.objectStore('s').get('main');
      r.onsuccess = () => {
        if (r.result) {
          Object.assign(STATE, r.result);
          STATE.config = { ...{
            bizName: 'My Business', gstin: '', address: '', phone: '', email: '',
            stateCode: '27', currency: '₹', invPrefix: 'INV-', invCounter: 1,
            estPrefix: 'EST-', estCounter: 1
          }, r.result.config || {} };
        }
        ok();
      };
      r.onerror = () => ok();
    });
  } catch { return; }
}
async function save() {
  try {
    if (!_db) _db = await idb();
    return new Promise(ok => {
      const t = _db.transaction('s', 'readwrite');
      t.objectStore('s').put(JSON.parse(JSON.stringify(STATE)), 'main');
      t.oncomplete = () => ok();
      t.onerror = () => ok();
    });
  } catch { return; }
}

/* Helpers */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const nowStr = () => new Date().toLocaleString();
const money = n => STATE.config.currency + (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function toast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on' + (kind ? ' ' + kind : '');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.className = 'toast', 2400);
}
function openModal(html) { $('modalBox').innerHTML = html; $('modalBg').classList.add('on'); }
function closeModal() { $('modalBg').classList.remove('on'); $('modalBox').innerHTML = ''; }
window.closeModal = closeModal;

/* GST */
function computeTax(lines, customerState) {
  const intra = !customerState || !STATE.config.stateCode || customerState === STATE.config.stateCode;
  let subtotal = 0, cgst = 0, sgst = 0, igst = 0;
  lines.forEach(l => {
    const amount = (Number(l.qty) || 0) * (Number(l.rate) || 0);
    subtotal += amount;
    const tax = amount * (Number(l.gst) || 0) / 100;
    if (intra) { cgst += tax / 2; sgst += tax / 2; } else igst += tax;
  });
  return { subtotal, cgst, sgst, igst, taxTotal: cgst + sgst + igst, total: subtotal + cgst + sgst + igst };
}
function paidAmount(inv) { return (inv.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0); }
function balance(inv) { return Math.max(0, inv.total - paidAmount(inv)); }
function invStatus(inv) {
  const paid = paidAmount(inv);
  if (paid >= inv.total - 0.01) return 'paid';
  if (paid > 0) return 'partial';
  return 'pending';
}
function pillFor(status) {
  const map = { paid: 'ok', partial: 'warn', pending: 'err', converted: 'ok', open: 'info', unpaid: 'err', draft: 'none' };
  return `<span class="pill ${map[status] || 'none'}">${status}</span>`;
}

};

function go(page) {

  currentPage = page;
  document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('on', n.dataset.nav === page));

  $('side').classList.remove('on');
  $('overlay').classList.remove('on');
  $('stage').innerHTML = '';
  PAGES[page].render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.go = go;
document.querySelectorAll('.nav-link').forEach(n => n.addEventListener('click', () => go(n.dataset.nav)));
$('menuBtn').onclick = () => { $('side').classList.toggle('on'); $('overlay').classList.toggle('on'); };
$('overlay').onclick = () => { $('side').classList.remove('on'); $('overlay').classList.remove('on'); };

/* ═════════════════════════════════════════════════
   DASHBOARD
   ═════════════════════════════════════════════════ */
let dashChart = null;

function renderDashboard() {
  $('topActions').innerHTML = `
    <button class="cta cta-ai" onclick="quickAIAction()">✦ Ask AI</button>
    <button class="cta" onclick="newInvoice()" style="margin-left:8px">+ Invoice</button>
  `;

  const totalSales = STATE.invoices.reduce((s, i) => s + i.total, 0);
  const totalPaid = STATE.invoices.reduce((s, i) => s + paidAmount(i), 0);
  const outstanding = totalSales - totalPaid;
  const expenses = STATE.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
  const purchases = STATE.bills.reduce((s, b) => s + b.total, 0);
  const net = totalSales - purchases - expenses;

  // AI forecast for next month
  const monthly = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    const ym = d.toISOString().slice(0, 7);
    monthly.push(STATE.invoices.filter(inv => inv.date?.startsWith(ym)).reduce((s, inv) => s + inv.total, 0));
  }
  const nextMonth = AI.forecast(monthly, 1)[0];
  const forecastDelta = monthly[monthly.length - 1] > 0
    ? ((nextMonth - monthly[monthly.length - 1]) / monthly[monthly.length - 1] * 100)
    : 0;

  const churn = AI.churnRisk(60);
  const priorities = AI.paymentPriorities().slice(0, 3);

  $('stage').innerHTML = `
    <div class="grid kpi-grid">
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-emerald"></span>Total Sales</div>
        <div class="kpi-value emerald">${money(totalSales)}</div>
        <div class="kpi-note">${STATE.invoices.length} invoices</div>
      </div>
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-rose"></span>Outstanding</div>
        <div class="kpi-value rose">${money(outstanding)}</div>
        <div class="kpi-note">${STATE.invoices.filter(i => invStatus(i) !== 'paid').length} unpaid</div>
      </div>
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-amber"></span>Expenses</div>
        <div class="kpi-value amber">${money(expenses)}</div>
        <div class="kpi-note">${STATE.expenses.length} entries</div>
      </div>
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-violet"></span>Net Profit</div>
        <div class="kpi-value ${net >= 0 ? 'emerald' : 'rose'}">${money(net)}</div>
        <div class="kpi-note">Sales − Purchases − Expenses</div>
      </div>
      <div class="kpi ai">
        <div class="kpi-label"><span class="dot dot-cyan"></span>Next Month Forecast</div>
        <div class="kpi-value cyan">${money(nextMonth)}</div>
        <div class="kpi-note">${forecastDelta >= 0 ? '↑' : '↓'} ${Math.abs(forecastDelta).toFixed(1)}% vs this month</div>
      </div>
      <div class="kpi ai">
        <div class="kpi-label"><span class="dot dot-pink"></span>AI Health Score</div>
        <div class="kpi-value pink">${healthScore()}/100</div>
        <div class="kpi-note">${healthLabel(healthScore())}</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Sales Performance</h3>
        <span class="sub">Last 6 months + AI forecast</span>
      </div>
      <div class="chart-wrap"><canvas id="dashChart"></canvas></div>
    </div>

    ${priorities.length ? `
      <div class="panel ai-panel">
        <div class="panel-head">
          <h3><span class="ai-icon">AI</span> Payment Priority</h3>
          <span class="sub">Top invoices to chase</span>
        </div>
        ${priorities.map(p => `
          <div class="ai-insight ${p.daysOverdue > 30 ? 'critical' : 'warning'}">
            <span class="ic">💰</span>
            <div class="body">
              <div class="title">${esc(p.customerName)} — ${money(p.balance)}</div>
              <div class="desc">Invoice ${esc(p.invoice.number)} · ${p.daysOverdue} days old</div>
              <div class="meta">Priority score: ${p.priority.toFixed(1)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    ${churn.length ? `
      <div class="panel ai-panel">
        <div class="panel-head">
          <h3><span class="ai-icon">AI</span> Customer Churn Risk</h3>

        </div>
        ${churn.slice(0, 3).map(c => `
          <div class="ai-insight warning">
            <span class="ic">⚠️</span>
            <div class="body">
              <div class="title">${esc(c.customer.name)}</div>
              <div class="desc">No orders in ${c.daysSince} days · spent ${money(c.totalSpent)} total</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div class="panel">
      <div class="panel-head">
        <h3>Recent Invoices</h3>
        <span class="sub">Latest activity</span>
      </div>
      ${STATE.invoices.length === 0
        ? `<div class="empty">
             <div class="empty-icon">◧</div>
             <div class="empty-title">No invoices yet</div>
             <div class="empty-note">Create your first invoice to start tracking sales.</div>
           </div>`
        : `<div class="tbl-scroll">
            <table class="data">
              <thead><tr><th>Invoice</th><th>Customer</th><th class="num">Total</th><th>Status</th></tr></thead>
              <tbody>
                ${[...STATE.invoices].reverse().slice(0, 6).map(i => `
                  <tr>
                    <td class="name">${esc(i.number)}</td>
                    <td>${esc(i.customerName)}</td>
                    <td class="num">${money(i.total)}</td>
                    <td>${pillFor(invStatus(i))}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
           </div>`}
    </div>
  `;

  const ctx = $('dashChart');
  if (!ctx) return;
  if (dashChart) dashChart.destroy();

  const months = [], values = [], forecast = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    months.push(d.toLocaleString('en', { month: 'short' }));
    values.push(STATE.invoices.filter(inv => inv.date?.startsWith(d.toISOString().slice(0,7))).reduce((s, inv) => s + inv.total, 0));
  }
  const nextD = new Date(); nextD.setMonth(nextD.getMonth() + 1);
  const labels = [...months, nextD.toLocaleString('en', { month: 'short' }) + ' (AI)'];
  const realData = [...values, null];
  const forecastData = [...Array(6).fill(null), nextMonth];

  const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 240);
  gradient.addColorStop(0, 'rgba(124,92,255,.5)');
  gradient.addColorStop(1, 'rgba(124,92,255,.02)');

  dashChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Actual', data: realData, borderColor: '#9b7fff', backgroundColor: gradient, borderWidth: 2.5, fill: true, tension: .4, pointBackgroundColor: '#08090f', pointBorderColor: '#9b7fff', pointBorderWidth: 2, pointRadius: 5 },
        { label: 'AI Forecast', data: forecastData, borderColor: '#22d3ee', borderWidth: 2, borderDash: [6, 4], fill: false, tension: .4, pointBackgroundColor: '#08090f', pointBorderColor: '#22d3ee', pointBorderWidth: 2, pointRadius: 6 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#9ba0b8', font: { size: 10 } } }, tooltip: { backgroundColor: '#1c2030', borderColor: 'rgba(255,255,255,.1)', borderWidth: 1, padding: 12, cornerRadius: 10, callbacks: { label: c => c.dataset.label + ': ' + money(c.parsed.y) } } },
      scales: {
        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,.04)' }, ticks: { color: '#5c6180', font: { size: 10 }, callback: v => STATE.config.currency + v } },
        x: { grid: { display: false }, ticks: { color: '#5c6180', font: { size: 10 } } }
      }
    }
  });
}

function healthScore() {
  let score = 70;
  const totalSales = STATE.invoices.reduce((s, i) => s + i.total, 0);
  const totalPaid = STATE.invoices.reduce((s, i) => s + paidAmount(i), 0);
  if (totalSales > 0) {
    const collectRate = totalPaid / totalSales;
    score = 40 + collectRate * 50;
  }
  const expenseRatio = STATE.expenses.reduce((s, e) => s + e.amount, 0) / Math.max(1, totalSales);
  score -= expenseRatio * 20;
  score += Math.min(15, STATE.customers.length);
  return Math.max(0, Math.min(100, Math.round(score)));
}
function healthLabel(s) {
  if (s >= 80) return 'Excellent';
  if (s >= 60) return 'Healthy';
  if (s >= 40) return 'Needs attention';
  return 'Critical';
}

      out.push(`
        <div class="panel ai-panel">
          <div class="panel-head">
            <h3><span class="ai-icon">AI</span> Duplicate Detection</h3>

function categorizeLive() {
  const v = $('catInput')?.value || '';
  const res = $('catResult');
  if (!res) return;
  if (!v.trim()) { res.textContent = ''; return; }
  const r = AI.categorizeExpense(v);
  const conf = Math.round(r.confidence * 100);
  const color = conf >= 80 ? 'var(--emerald)' : conf >= 50 ? 'var(--amber)' : 'var(--text-3)';
  res.innerHTML = `Suggested category: <b style="color:${color}">${r.category}</b> · confidence ${conf}%`;
}

function parseNL() {
  const text = $('nlText')?.value || '';
  if (!text.trim()) return toast('Enter a description', 'err');
  const parsed = AI.parseNaturalInvoice(text);
  if (!parsed || (!parsed.customer && !parsed.items.length)) {
    return toast('Could not understand. Try: "2 x Item at 500 to Customer Name"', 'err');
  }

  let summary = '<div style="font-size:13px;line-height:1.8">';
  summary += `<b class="cyan">Customer:</b> ${parsed.customer ? esc(parsed.customer.name) : '<span class="rose">not found — add them first</span>'}<br>`;
  summary += `<b class="cyan">Date:</b> ${parsed.date || today()}<br>`;
  summary += `<b class="cyan">Items:</b><br>`;
  if (parsed.items.length) {
    parsed.items.forEach(it => {
      summary += `&nbsp;&nbsp;• ${it.qty} × ${esc(it.name)} @ ${money(it.rate)}<br>`;
    });
  } else {
    summary += `&nbsp;&nbsp;<span class="rose">No items detected</span><br>`;
  }
  summary += '</div>';

  openModal(`
    <div class="modal-head">
      <h3><span class="ai-icon">AI</span> Parsed Invoice</h3>
      <button class="x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      ${summary}
      <p style="font-size:11px;color:var(--text-3);margin-top:14px;line-height:1.6">
        Review the parsed data. Click "Create Invoice" to open the invoice builder with these values pre-filled.
      </p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-ai" onclick='applyNL(${JSON.stringify(parsed).replace(/'/g, "&#39;")})'>Create Invoice →</button>
    </div>
  `);
}

function applyNL(parsed) {
  closeModal();
  if (!STATE.customers.length) return toast('Add a customer first', 'err');
  if (!parsed.customer) return toast('Customer not recognized', 'err');

  newInvoice();
  setTimeout(() => {
    const sel = $('inv_cust');
    if (sel && parsed.customer) sel.value = parsed.customer.id;
    if (parsed.date && $('inv_date')) $('inv_date').value = parsed.date;

    const container = $('lines');
    if (!container) return;
    container.innerHTML = '';
    window._itemOpts = STATE.items.map(i => `<option value="${i.id}">${esc(i.name)} — ${money(i.rate)}</option>`).join('');
    window._lineCounter = 0;

    if (parsed.items.length === 0) {
      addLine();
    } else {
      parsed.items.forEach(it => {
        addLine();
        const last = container.lastElementChild;
        if (last) {
          last.querySelector('.li-item').value = it.itemId || '__custom';
          last.querySelector('.li-qty').value = it.qty;
          last.querySelector('.li-rate').value = it.rate;
          last.querySelector('.li-gst').value = it.gst;
        }
      });
    }
    recalc();
    toast('AI filled the invoice — review and save', 'ai');
  }, 150);
}

async function saveItem(id) {
  const name = $('i_name').value.trim();
  if (!name) return toast('Name required', 'err');
  const data = { name, description: $('i_desc').value.trim(), rate: Number($('i_rate').value) || 0, gst: Number($('i_gst').value) || 0, stock: Number($('i_stock').value) || 0, unit: $('i_unit').value.trim() || 'pcs' };
  if (id) Object.assign(STATE.items.find(x => x.id === id), data);
  else STATE.items.push({ id: uid(), ...data, created: nowStr() });
  await save();
  closeModal();
  toast(id ? 'Item updated' : 'Item added', 'ok');

async function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  STATE.items = STATE.items.filter(x => x.id !== id);

let lineSeq = 0;

function newInvoice() {
  if (STATE.customers.length === 0) return toast('Add a customer first', 'err');
  lineSeq = 0;
  const custOpts = STATE.customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  window._itemOpts = STATE.items.map(i => `<option value="${i.id}">${esc(i.name)} — ${money(i.rate)}</option>`).join('');

  openModal(`
    <div class="modal-head">
      <h3>New Invoice</h3>
      <button class="x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Customer <span class="req">*</span></label>
          <select id="inv_cust" onchange="recalc()">${custOpts}</select>
        </div>
        <div class="field"><label>Invoice Date</label><input id="inv_date" type="date" value="${today()}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Due Date</label><input id="inv_due" type="date" value="${today()}"></div>
        <div class="field"><label>Notes</label><input id="inv_notes" placeholder="Optional"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px">
        <label style="font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:.3px">LINE ITEMS</label>
        <button class="btn btn-ghost btn-sm" onclick="addLine()">+ Add</button>
      </div>
      <div class="line-items" id="lines"></div>
      <div class="totals" id="totals"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveInvoice()">Create Invoice</button>
    </div>
  `);
  addLine();
}

function addLine() {
  lineSeq++;
  const id = 'ln' + lineSeq;
  const el = document.createElement('div');
  el.className = 'line';
  el.id = id;
  el.innerHTML = `
    <select class="li-item" onchange="pickItem(this,'${id}')">
      <option value="">— Item —</option>
      ${window._itemOpts || ''}
      <option value="__custom">Custom line...</option>
    </select>
    <input class="li-qty" type="number" value="1" min="0" placeholder="Qty" oninput="recalc()">
    <input class="li-rate" type="number" value="0" min="0" placeholder="Rate" oninput="recalc()">
    <input class="li-gst" type="number" value="18" min="0" placeholder="GST%" oninput="recalc()">
    <button class="rm" onclick="this.parentElement.remove();recalc()">✕</button>
  `;
  $('lines').appendChild(el);
}

function pickItem(sel, lineId) {
  const line = $(lineId);
  const it = STATE.items.find(x => x.id === sel.value);
  if (it) {
    line.querySelector('.li-rate').value = it.rate;
    line.querySelector('.li-gst').value = it.gst;
  }
  recalc();
}

function collectLines() {
  const lines = [];
  document.querySelectorAll('#lines .line').forEach(l => {
    const sel = l.querySelector('.li-item');
    const qty = Number(l.querySelector('.li-qty').value) || 0;
    const rate = Number(l.querySelector('.li-rate').value) || 0;
    const gst = Number(l.querySelector('.li-gst').value) || 0;
    const itemId = sel.value;
    const itemName = itemId && itemId !== '__custom'
      ? (STATE.items.find(x => x.id === itemId)?.name || 'Item')
      : 'Custom item';
    lines.push({ itemId, name: itemName, qty, rate, gst });
  });
  return lines.filter(l => l.qty > 0);
}

function recalc() {
  const lines = collectLines();
  const custId = $('inv_cust')?.value;
  const cust = STATE.customers.find(c => c.id === custId);
  const t = computeTax(lines, cust?.stateCode || '');
  const el = $('totals');
  if (!el) return;
  el.innerHTML = `
    <div class="totals-row"><span>Subtotal</span><b>${money(t.subtotal)}</b></div>
    ${t.cgst ? `<div class="totals-row"><span>CGST</span><b>${money(t.cgst)}</b></div>` : ''}
    ${t.sgst ? `<div class="totals-row"><span>SGST</span><b>${money(t.sgst)}</b></div>` : ''}
    ${t.igst ? `<div class="totals-row"><span>IGST</span><b>${money(t.igst)}</b></div>` : ''}
    <div class="totals-grand"><span>Total</span><span>${money(t.total)}</span></div>
  `;
}

async function saveInvoice() {
  const custId = $('inv_cust').value;
  const cust = STATE.customers.find(c => c.id === custId);
  if (!cust) return toast('Select a customer', 'err');
  const lines = collectLines();
  if (lines.length === 0) return toast('Add at least one line', 'err');
  const t = computeTax(lines, cust.stateCode);
  const num = STATE.config.invPrefix + String(STATE.config.invCounter).padStart(4, '0');

  STATE.invoices.push({
    id: uid(), number: num,
    date: $('inv_date').value, dueDate: $('inv_due').value,
    customerId: cust.id, customerName: cust.name,
    customerGSTIN: cust.gstin || '', customerStateCode: cust.stateCode || '',
    items: lines,
    subtotal: t.subtotal, cgst: t.cgst, sgst: t.sgst, igst: t.igst, total: t.total,
    notes: $('inv_notes').value.trim(),
    payments: [], created: nowStr()
  });

  lines.forEach(l => {
    if (l.itemId && l.itemId !== '__custom') {
      const it = STATE.items.find(x => x.id === l.itemId);
      if (it && it.stock != null) it.stock = Math.max(0, it.stock - l.qty);
    }
  });
  STATE.config.invCounter++;
  await save();
  closeModal();
  toast('Invoice ' + num + ' created', 'ok');
  renderInvoices();
}

async function deleteInvoice(id) {

function recordPayment(invId) {
  const inv = STATE.invoices.find(x => x.id === invId);
  if (!inv) return;
  const bal = balance(inv);
  openModal(`
    <div class="modal-head"><h3>Record Payment</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-2);margin-bottom:14px;padding:10px 12px;background:rgba(8,9,15,.5);border-radius:8px">

      </div>
      <div class="field-row">
        <div class="field"><label>Amount</label><input id="p_amt" type="number" value="${bal.toFixed(2)}" step="0.01" autofocus></div>
        <div class="field"><label>Date</label><input id="p_date" type="date" value="${today()}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Method</label>

      </div>

async function savePayment(invId) {
  const inv = STATE.invoices.find(x => x.id === invId);
  if (!inv) return;
  const amt = Number($('p_amt').value) || 0;
  if (amt <= 0) return toast('Invalid amount', 'err');
  inv.payments = inv.payments || [];
  inv.payments.push({ id: uid(), date: $('p_date').value, amount: amt, method: $('p_method').value, reference: $('p_ref').value.trim(), recorded: nowStr() });
  await save();
  closeModal();
  toast('Payment recorded', 'ok');
  if (currentPage === 'dashboard') renderDashboard();
  else if (currentPage === 'invoices') renderInvoices();
  else if (currentPage === 'payments') renderPayments();
}

function pdfInvoice(id) {
  const inv = STATE.invoices.find(x => x.id === id);
  if (!inv) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const c = STATE.config;

  doc.setFontSize(20); doc.setFont(undefined, 'bold');
  doc.text(c.bizName || 'My Business', 14, 22);
  doc.setFontSize(9); doc.setFont(undefined, 'normal');
  let y = 29;
  if (c.address) { doc.text(c.address, 14, y); y += 5; }
  if (c.gstin) { doc.text('GSTIN: ' + c.gstin, 14, y); y += 5; }
  if (c.phone) { doc.text('Phone: ' + c.phone, 14, y); y += 5; }

  doc.setFontSize(16); doc.setFont(undefined, 'bold');
  doc.text('TAX INVOICE', 196, 22, { align: 'right' });
  doc.setFontSize(10); doc.setFont(undefined, 'normal');
  doc.text(inv.number, 196, 29, { align: 'right' });
  doc.text('Date: ' + inv.date, 196, 34, { align: 'right' });
  doc.text('Due: ' + inv.dueDate, 196, 39, { align: 'right' });

  y = Math.max(y, 44) + 6;
  doc.setFontSize(9); doc.setTextColor(120);
  doc.text('BILL TO', 14, y);
  doc.setTextColor(0);
  y += 6;
  doc.setFontSize(12); doc.setFont(undefined, 'bold');
  doc.text(inv.customerName, 14, y);
  y += 5;
  doc.setFont(undefined, 'normal'); doc.setFontSize(9);
  if (inv.customerGSTIN) { doc.text('GSTIN: ' + inv.customerGSTIN, 14, y); y += 4; }
  y += 6;

  doc.autoTable({
    startY: y,
    head: [['Item', 'Qty', 'Rate', 'GST%', 'Amount']],
    body: inv.items.map(it => [it.name, String(it.qty), money(it.rate), it.gst + '%', money(it.qty * it.rate)]),
    theme: 'grid',
    headStyles: { fillColor: [124, 92, 255], fontSize: 9 },
    bodyStyles: { fontSize: 9 },
    columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } }
  });

  let ey = doc.lastAutoTable.finalY + 8;
  const lx = 130, vx = 196;
  doc.setFontSize(9);
  doc.text('Subtotal', lx, ey); doc.text(money(inv.subtotal), vx, ey, { align: 'right' }); ey += 5;
  if (inv.cgst) { doc.text('CGST', lx, ey); doc.text(money(inv.cgst), vx, ey, { align: 'right' }); ey += 5; }
  if (inv.sgst) { doc.text('SGST', lx, ey); doc.text(money(inv.sgst), vx, ey, { align: 'right' }); ey += 5; }
  if (inv.igst) { doc.text('IGST', lx, ey); doc.text(money(inv.igst), vx, ey, { align: 'right' }); ey += 5; }
  doc.line(lx, ey, vx, ey); ey += 6;
  doc.setFontSize(12); doc.setFont(undefined, 'bold');
  doc.text('Total', lx, ey); doc.text(money(inv.total), vx, ey, { align: 'right' });
  doc.save(inv.number + '.pdf');
  toast('PDF downloaded', 'ok');
}

async function saveEstimate() {
  const custId = $('inv_cust').value;
  const cust = STATE.customers.find(c => c.id === custId);
  if (!cust) return toast('Select a customer', 'err');
  const lines = collectLines();
  if (lines.length === 0) return toast('Add at least one line', 'err');
  const t = computeTax(lines, cust.stateCode);
  const num = STATE.config.estPrefix + String(STATE.config.estCounter).padStart(4, '0');
  STATE.estimates.push({
    id: uid(), number: num, date: $('inv_date').value,
    customerId: cust.id, customerName: cust.name,
    items: lines, subtotal: t.subtotal, cgst: t.cgst, sgst: t.sgst, igst: t.igst, total: t.total,
    converted: false, created: nowStr()
  });
  STATE.config.estCounter++;
  await save();
  closeModal();
  toast('Estimate ' + num + ' saved', 'ok');
  renderEstimates();
}

async function convertEstimate(id) {
  const est = STATE.estimates.find(x => x.id === id);
  if (!est) return;
  if (!confirm('Convert ' + est.number + ' to an invoice?')) return;
  const cust = STATE.customers.find(c => c.id === est.customerId);
  const t = computeTax(est.items, cust?.stateCode || '');
  const num = STATE.config.invPrefix + String(STATE.config.invCounter).padStart(4, '0');
  STATE.invoices.push({
    id: uid(), number: num, date: today(), dueDate: today(),
    customerId: est.customerId, customerName: est.customerName,
    customerGSTIN: cust?.gstin || '', customerStateCode: cust?.stateCode || '',
    items: est.items, subtotal: t.subtotal, cgst: t.cgst, sgst: t.sgst, igst: t.igst, total: t.total,
    notes: 'Converted from ' + est.number, payments: [], created: nowStr()
  });
  STATE.config.invCounter++;
  est.converted = true; est.convertedTo = num;
  await save();
  toast('Converted to ' + num, 'ok');
  go('invoices');
}

async function deleteEstimate(id) {
  if (!confirm('Delete this estimate?')) return;
  STATE.estimates = STATE.estimates.filter(e => e.id !== id);
  await save();
  toast('Estimate deleted');
  renderEstimates();
}

function aiCatExpense() {

  const r = AI.categorizeExpense(v);
  if (r.confidence >= 0.5) {
    hint.innerHTML = `✦ AI suggests: <b>${r.category}</b>`;
    const sel = $('e_cat');
    if (sel) sel.value = r.category;
  } else {

/* ═════════════════════════════════════════════════
   REPORTS
   ═════════════════════════════════════════════════ */
function renderReports() {
  $('topActions').innerHTML = '';
  const totalSales = STATE.invoices.reduce((s, i) => s + i.total, 0);
  const totalPurchases = STATE.bills.reduce((s, b) => s + b.total, 0);
  const totalExpenses = STATE.expenses.reduce((s, e) => s + e.amount, 0);
  const gross = totalSales - totalPurchases;
  const net = gross - totalExpenses;
  const gstOut = STATE.invoices.reduce((s, i) => s + i.cgst + i.sgst + i.igst, 0);

  const aging = { a: 0, b: 0, c: 0, d: 0 };
  STATE.invoices.forEach(inv => {
    const bal = balance(inv);
    if (bal <= 0) return;
    const days = Math.ceil((new Date() - new Date(inv.date)) / 86400000);
    if (days <= 30) aging.a += bal;
    else if (days <= 60) aging.b += bal;
    else if (days <= 90) aging.c += bal;
    else aging.d += bal;
  });

  $('stage').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3>Profit & Loss</h3></div>
      <div style="font-size:13px">
        <div class="totals-row"><span>Revenue</span><b class="emerald">${money(totalSales)}</b></div>
        <div class="totals-row"><span>Cost of Purchases</span><b class="rose">− ${money(totalPurchases)}</b></div>
        <div class="totals-row" style="border-top:1px solid var(--line);padding-top:10px;margin-top:6px"><span><b>Gross Profit</b></span><b>${money(gross)}</b></div>
        <div class="totals-row"><span>Operating Expenses</span><b class="rose">− ${money(totalExpenses)}</b></div>
        <div class="totals-grand"><span>Net Profit</span><span class="${net >= 0 ? 'emerald' : 'rose'}">${money(net)}</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Receivables Aging</h3></div>
      <div class="tbl-scroll" style="margin:0">
        <table class="data" style="min-width:auto">
          <thead><tr><th>Age Bucket</th><th class="num">Amount</th></tr></thead>
          <tbody>
            <tr><td>0 – 30 days</td><td class="num emerald">${money(aging.a)}</td></tr>
            <tr><td>31 – 60 days</td><td class="num amber">${money(aging.b)}</td></tr>
            <tr><td>61 – 90 days</td><td class="num rose">${money(aging.c)}</td></tr>
            <tr><td>90+ days</td><td class="num rose">${money(aging.d)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>GST Summary</h3></div>
      <div style="font-size:13px">
        <div class="totals-row"><span>GST Collected (Output)</span><b>${money(gstOut)}</b></div>
        <div class="totals-row"><span>GST Paid (Input)</span><b>${money(0)}</b></div>
        <div class="totals-grand"><span>Net GST Payable</span><span class="amber">${money(gstOut)}</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Export</h3></div>
      <div class="btn-row" style="justify-content:flex-start">
        <button class="btn btn-ghost" onclick="exportCSV()">📊 Invoices CSV</button>
        <button class="btn btn-ghost" onclick="exportGST()">🧾 GSTR-1 CSV</button>
        <button class="btn btn-ghost" onclick="exportBackup()">💾 Full Backup</button>
      </div>
    </div>
  `;
}

function exportCSV() {
  let csv = 'Invoice,Date,Customer,Subtotal,CGST,SGST,IGST,Total,Status\n';
  STATE.invoices.forEach(i => {
    csv += `"${i.number}","${i.date}","${i.customerName}",${i.subtotal.toFixed(2)},${i.cgst.toFixed(2)},${i.sgst.toFixed(2)},${i.igst.toFixed(2)},${i.total.toFixed(2)},"${invStatus(i)}"\n`;
  });
  dl(new Blob([csv], { type: 'text/csv' }), 'invoices_' + today() + '.csv');
  toast('CSV exported', 'ok');
}

function exportGST() {
  let csv = 'GSTIN,Invoice,Date,Customer,Taxable,CGST,SGST,IGST,Total\n';
  STATE.invoices.filter(i => i.cgst || i.sgst || i.igst).forEach(i => {
    csv += `"${STATE.config.gstin}","${i.number}","${i.date}","${i.customerName}",${i.subtotal.toFixed(2)},${i.cgst.toFixed(2)},${i.sgst.toFixed(2)},${i.igst.toFixed(2)},${i.total.toFixed(2)}\n`;
  });
  dl(new Blob([csv], { type: 'text/csv' }), 'GSTR1_' + today() + '.csv');
  toast('GSTR-1 exported', 'ok');
}

function exportBackup() {
  dl(new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' }), 'aurora_ai_backup_' + today() + '.json');
  toast('Backup downloaded', 'ok');
}

function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

        <button class="btn btn-primary" onclick="saveSettings()">Save</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Data Management</h3></div>
      <div class="btn-row" style="justify-content:flex-start">
        <button class="btn btn-ghost" onclick="exportBackup()">💾 Export Backup</button>
        <button class="btn btn-ghost" onclick="$('importFile').click()">📥 Import Backup</button>
        <button class="btn btn-danger" onclick="resetAll()">🗑 Reset All Data</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importFile(event)">
      <p style="margin-top:14px;font-size:11px;color:var(--text-3);line-height:1.6">
        All data lives privately in your browser. AI runs 100% locally — no data sent anywhere.
      </p>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>About Aurora AI</h3></div>

        <b style="color:var(--text)">Aurora AI Business Suite</b> — offline-first manager with 10 built-in AI features.<br><br>

async function saveSettings() {
  Object.assign(STATE.config, {
    bizName: $('s_name').value.trim() || 'My Business',
    gstin: $('s_gstin').value.trim(),
    phone: $('s_phone').value.trim(),
    email: $('s_email').value.trim(),
    address: $('s_addr').value.trim(),
    stateCode: $('s_state').value.trim(),
    currency: $('s_curr').value.trim() || '₹',
    invPrefix: $('s_invpre').value.trim() || 'INV-',
    invCounter: Number($('s_invcnt').value) || 1,
    estPrefix: $('s_estpre').value.trim() || 'EST-',
    estCounter: Number($('s_estcnt').value) || 1
  });
  await save();
  toast('Settings saved', 'ok');
}

async function importFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!confirm('Replace all current data with this backup?')) return;
    Object.assign(STATE, data);
    await save();
    toast('Backup restored', 'ok');
    go('dashboard');
  } catch { toast('Invalid backup file', 'err'); }
}

async function resetAll() {
  if (!confirm('Delete ALL data?')) return;
  if (!confirm('Are you absolutely sure?')) return;
  Object.keys(STATE).forEach(k => { if (Array.isArray(STATE[k])) STATE[k] = []; });
  STATE.config = {
    bizName: 'My Business', gstin: '', address: '', phone: '', email: '',
    stateCode: '27', currency: '₹', invPrefix: 'INV-', invCounter: 1,
    estPrefix: 'EST-', estCounter: 1
  };
  await save();
  toast('All data cleared', 'ok');
  go('dashboard');
}
