<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090f">
<title>Aurora — Business Suite</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf@2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable@3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* ═══════════════════════════════════════════════
   AURORA — Design System
   ═══════════════════════════════════════════════ */
:root {
  --bg-0: #08090f;
  --bg-1: #0d0f18;
  --bg-2: #131623;
  --bg-3: #1c2030;
  --line: rgba(255,255,255,.06);
  --line-2: rgba(255,255,255,.1);
  --text: #eef0f8;
  --text-2: #9ba0b8;
  --text-3: #5c6180;
  --violet: #7c5cff;
  --violet-2: #9b7fff;
  --violet-glow: rgba(124,92,255,.4);
  --emerald: #10d97a;
  --rose: #ff4f6e;
  --amber: #ffb547;
  --cyan: #22d3ee;
  --pink: #f472b6;
  --r-sm: 8px;
  --r: 14px;
  --r-lg: 20px;
  --shadow-lg: 0 20px 60px -20px rgba(0,0,0,.8);
  --transition: cubic-bezier(.4,.2,.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html { font-size:16px; -webkit-font-smoothing:antialiased }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-0);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% -10%, rgba(124,92,255,.18), transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 10%, rgba(34,211,238,.08), transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 100%, rgba(244,114,182,.06), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ─── LAYOUT ─────────────────────────────── */
.shell {
  display: grid;
  grid-template-columns: 250px 1fr;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ─── SIDEBAR ────────────────────────────── */
.side {
  background: rgba(13,15,24,.8);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-right: 1px solid var(--line);
  padding: 22px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.side::-webkit-scrollbar { width: 0 }

.brand {
  padding: 0 22px 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.brand-mark {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--violet), var(--pink));
  display: grid; place-items: center;
  font-size: 17px;
  box-shadow: 0 8px 24px -8px var(--violet-glow);
  flex-shrink: 0;
}
.brand-text h1 {
  font-size: 15px; font-weight: 700; letter-spacing: -.3px;
  background: linear-gradient(135deg, #fff, #9ba0b8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-text p { font-size: 10px; color: var(--text-3); letter-spacing: .5px; text-transform: uppercase; margin-top: 1px }

.nav-label {
  padding: 12px 22px 6px;
  font-size: 10px; font-weight: 700; color: var(--text-3);
  letter-spacing: 1.2px; text-transform: uppercase;
}
.nav-link {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 22px;
  font-size: 13px; font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all .18s var(--transition);
  position: relative;
  border: none; background: none;
  width: 100%; text-align: left;
  font-family: inherit;
}
.nav-link::before {
  content: '';
  position: absolute; left: 0; top: 50%;
  transform: translateY(-50%) scaleY(0);
  width: 3px; height: 20px;
  background: linear-gradient(180deg, var(--violet), var(--pink));
  border-radius: 0 3px 3px 0;
  transition: transform .2s var(--transition);
}
.nav-link:hover { color: var(--text); background: rgba(255,255,255,.03) }
.nav-link.on {
  color: var(--text);
  background: linear-gradient(90deg, rgba(124,92,255,.12), transparent 80%);
}
.nav-link.on::before { transform: translateY(-50%) scaleY(1) }
.nav-link .ic {
  font-size: 15px; width: 18px;
  display: inline-flex; justify-content: center;
  opacity: .8;
}
.nav-link.on .ic { opacity: 1 }

.side-foot {
  margin-top: auto;
  padding: 14px 22px 0;
  border-top: 1px solid var(--line);
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: .3px;
}

/* ─── MAIN ───────────────────────────────── */
.main { min-width: 0; display: flex; flex-direction: column }

.top {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 28px;
  border-bottom: 1px solid var(--line);
  background: rgba(13,15,24,.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 20;
}
.menu {
  display: none;
  width: 34px; height: 34px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  align-items: center; justify-content: center;
}
.crumb { flex: 1; min-width: 0 }
.crumb h2 {
  font-size: 17px; font-weight: 700;
  letter-spacing: -.4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.crumb p {
  font-size: 11px; color: var(--text-3); margin-top: 1px;
  letter-spacing: .2px;
}

.cta {
  padding: 9px 16px;
  background: linear-gradient(135deg, var(--violet), #6a4aff);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all .2s var(--transition);
  box-shadow: 0 8px 20px -6px var(--violet-glow);
  letter-spacing: .2px;
}
.cta:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -8px var(--violet-glow) }
.cta:active { transform: translateY(0) }

.icon-btn {
  width: 34px; height: 34px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--text-2);
  cursor: pointer;
  font-size: 14px;
  transition: all .18s var(--transition);
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--bg-3); color: var(--text); border-color: var(--line-2) }

.stage { padding: 24px 28px 40px; flex: 1 }

/* ─── CARDS ──────────────────────────────── */
.grid {
  display: grid;
  gap: 14px;
  margin-bottom: 20px;
}
.kpi-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) }
.kpi {
  background: linear-gradient(180deg, rgba(28,32,48,.6), rgba(19,22,35,.6));
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
  transition: border-color .2s var(--transition);
}
.kpi:hover { border-color: var(--line-2) }
.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(124,92,255,.5), transparent);
  opacity: 0;
  transition: opacity .3s;
}
.kpi:hover::before { opacity: 1 }
.kpi-label {
  font-size: 10px; font-weight: 700;
  color: var(--text-3); letter-spacing: 1px;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.kpi-label .dot {
  width: 6px; height: 6px; border-radius: 50%;
  display: inline-block;
}
.kpi-value {
  font-size: 22px; font-weight: 700;
  margin-top: 8px;
  letter-spacing: -.6px;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.kpi-note {
  font-size: 11px; color: var(--text-3); margin-top: 4px;
}
.dot-violet { background: var(--violet); box-shadow: 0 0 8px var(--violet-glow) }
.dot-emerald { background: var(--emerald); box-shadow: 0 0 8px rgba(16,217,122,.5) }
.dot-rose { background: var(--rose); box-shadow: 0 0 8px rgba(255,79,110,.5) }
.dot-amber { background: var(--amber); box-shadow: 0 0 8px rgba(255,181,71,.5) }
.dot-cyan { background: var(--cyan); box-shadow: 0 0 8px rgba(34,211,238,.5) }
.dot-pink { background: var(--pink); box-shadow: 0 0 8px rgba(244,114,182,.5) }

.violet { color: var(--violet-2) }
.emerald { color: var(--emerald) }
.rose { color: var(--rose) }
.amber { color: var(--amber) }
.cyan { color: var(--cyan) }
.pink { color: var(--pink) }

.panel {
  background: rgba(19,22,35,.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px 22px;
  margin-bottom: 16px;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}
.panel-head h3 {
  font-size: 14px; font-weight: 700;
  letter-spacing: -.2px;
  display: flex; align-items: center; gap: 8px;
}
.panel-head .sub {
  font-size: 11px; color: var(--text-3);
  font-weight: 500; letter-spacing: .2px;
}
.panel-actions { display: flex; gap: 8px }

/* ─── TABLES ─────────────────────────────── */
.tbl-scroll {
  overflow-x: auto;
  margin: 0 -22px;
  padding: 0 22px;
}
.tbl-scroll::-webkit-scrollbar { height: 6px }
.tbl-scroll::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px }

table.data {
  width: 100%; border-collapse: collapse;
  font-size: 13px; min-width: 520px;
}
table.data th {
  text-align: left; padding: 11px 12px;
  font-size: 10px; font-weight: 700;
  color: var(--text-3);
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.data td {
  padding: 13px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
table.data tbody tr {
  transition: background .15s var(--transition);
}
table.data tbody tr:hover { background: rgba(255,255,255,.02) }
table.data tbody tr:last-child td { border-bottom: none }
table.data .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500 }
table.data .name { font-weight: 600; color: var(--text) }
table.data .sm { font-size: 11px; color: var(--text-3); margin-top: 2px; font-weight: 400 }
.row-btns { display: flex; gap: 4px; justify-content: flex-end }
.row-btn {
  width: 28px; height: 28px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--text-3);
  cursor: pointer;
  font-size: 12px;
  transition: all .15s var(--transition);
  display: grid; place-items: center;
}
.row-btn:hover {
  background: var(--bg-2); color: var(--text); border-color: var(--line-2);
}
.row-btn.danger:hover { color: var(--rose); border-color: rgba(255,79,110,.3) }

/* ─── PILLS ──────────────────────────────── */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.pill::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
}
.pill.ok { background: rgba(16,217,122,.12); color: var(--emerald) }
.pill.ok::before { background: var(--emerald); box-shadow: 0 0 6px var(--emerald) }
.pill.warn { background: rgba(255,181,71,.12); color: var(--amber) }
.pill.warn::before { background: var(--amber); box-shadow: 0 0 6px var(--amber) }
.pill.err { background: rgba(255,79,110,.12); color: var(--rose) }
.pill.err::before { background: var(--rose); box-shadow: 0 0 6px var(--rose) }
.pill.info { background: rgba(124,92,255,.12); color: var(--violet-2) }
.pill.info::before { background: var(--violet); box-shadow: 0 0 6px var(--violet) }
.pill.none { background: rgba(155,160,184,.1); color: var(--text-3) }
.pill.none::before { background: var(--text-3) }

/* ─── EMPTY ──────────────────────────────── */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-3);
  font-size: 13px;
}
.empty-icon {
  width: 56px; height: 56px;
  margin: 0 auto 14px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(124,92,255,.15), rgba(244,114,182,.1));
  border: 1px solid var(--line-2);
  display: grid; place-items: center;
  font-size: 24px;
  opacity: .8;
}
.empty-title { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 4px }
.empty-note { font-size: 12px; max-width: 300px; margin: 0 auto; line-height: 1.6 }

/* ─── FORMS ──────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px }
.field label {
  font-size: 11px; font-weight: 600;
  color: var(--text-2);
  letter-spacing: .3px;
}
.field label .req { color: var(--rose) }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 13px;
  background: rgba(8,9,15,.6);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: all .18s var(--transition);
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--violet);
  box-shadow: 0 0 0 3px var(--violet-glow);
}
.field textarea { min-height: 74px; resize: vertical }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.field-row.three { grid-template-columns: 1fr 1fr 1fr }

/* ─── BUTTONS ────────────────────────────── */
.btn {
  padding: 10px 18px;
  border: none;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all .18s var(--transition);
  letter-spacing: .2px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--violet), #6a4aff);
  color: #fff;
  box-shadow: 0 8px 20px -6px var(--violet-glow);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -8px var(--violet-glow) }
.btn-success { background: linear-gradient(135deg, var(--emerald), #0bb566); color: #fff; box-shadow: 0 8px 20px -6px rgba(16,217,122,.4) }
.btn-ghost {
  background: rgba(255,255,255,.04);
  color: var(--text-2);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: rgba(255,255,255,.08); color: var(--text); border-color: var(--line-2) }
.btn-danger { background: rgba(255,79,110,.1); color: var(--rose); border: 1px solid rgba(255,79,110,.2) }
.btn-danger:hover { background: rgba(255,79,110,.15) }
.btn-sm { padding: 7px 12px; font-size: 12px }
.btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap }

/* ─── MODAL ──────────────────────────────── */
.modal-bg {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4,5,10,.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: flex-start; justify-content: center;
  padding: 24px;
  overflow-y: auto;
}
.modal-bg.on { display: flex; animation: fadeIn .2s var(--transition) }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

.modal {
  background: linear-gradient(180deg, rgba(28,32,48,.98), rgba(19,22,35,.98));
  border: 1px solid var(--line-2);
  border-radius: var(--r-lg);
  width: 100%; max-width: 620px;
  box-shadow: var(--shadow-lg);
  margin: auto;
  animation: slideUp .28s var(--transition);
  overflow: hidden;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px) scale(.98) }
  to { opacity: 1; transform: none }
}
.modal-head {
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h3 { font-size: 15px; font-weight: 700; letter-spacing: -.3px }
.modal-head .x {
  width: 30px; height: 30px;
  background: transparent; border: none;
  color: var(--text-3); font-size: 20px;
  cursor: pointer; border-radius: 6px;
  transition: all .15s;
  line-height: 1;
}
.modal-head .x:hover { background: var(--bg-2); color: var(--text) }
.modal-body { padding: 22px }
.modal-foot {
  padding: 16px 22px;
  border-top: 1px solid var(--line);
  display: flex; gap: 8px; justify-content: flex-end;
  flex-wrap: wrap;
}

/* ─── TOAST ──────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translate(-50%, 80px);
  background: linear-gradient(135deg, rgba(28,32,48,.98), rgba(19,22,35,.98));
  border: 1px solid var(--line-2);
  color: var(--text);
  padding: 12px 22px;
  border-radius: 30px;
  font-size: 13px; font-weight: 600;
  z-index: 200;
  transition: transform .3s var(--transition);
  box-shadow: var(--shadow-lg);
  pointer-events: none;
  max-width: 90vw;
}
.toast.on { transform: translate(-50%, 0) }
.toast.err { border-color: rgba(255,79,110,.3); color: var(--rose) }
.toast.ok { border-color: rgba(16,217,122,.3); color: var(--emerald) }

/* ─── CHART ──────────────────────────────── */
.chart-wrap { position: relative; height: 240px; margin: 6px 0 }

/* ─── LINE ITEMS ─────────────────────────── */
.line-items { display: flex; flex-direction: column; gap: 6px }
.line {
  display: grid;
  grid-template-columns: 2fr 60px 90px 65px 30px;
  gap: 6px;
  align-items: center;
}
.line input, .line select {
  padding: 8px 10px;
  background: rgba(8,9,15,.6);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  outline: none;
  width: 100%;
  transition: border-color .15s;
}
.line input:focus, .line select:focus { border-color: var(--violet) }
.line .rm {
  width: 30px; height: 30px;
  background: transparent; border: none;
  color: var(--text-3); cursor: pointer;
  border-radius: 6px;
  font-size: 13px;
  transition: all .15s;
}
.line .rm:hover { background: rgba(255,79,110,.1); color: var(--rose) }

.totals {
  margin-top: 16px;
  padding: 16px 18px;
  background: rgba(8,9,15,.5);
  border: 1px solid var(--line);
  border-radius: var(--r);
  font-size: 13px;
}
.totals-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 0;
  color: var(--text-2);
}
.totals-row b { color: var(--text); font-variant-numeric: tabular-nums }
.totals-grand {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0 0;
  margin-top: 8px;
  border-top: 1px solid var(--line-2);
  font-size: 17px; font-weight: 700;
  letter-spacing: -.3px;
}

/* ─── THERMAL ────────────────────────────── */
.thermal {
  background: #fff; color: #000;
  padding: 14px 16px;
  font-family: 'Courier New', ui-monospace, monospace;
  font-size: 11px;
  line-height: 1.5;
  max-width: 300px;
  margin: 0 auto;
  border-radius: 4px;
}
.thermal .center { text-align: center }
.thermal .biz { font-size: 13px; font-weight: 700 }
.thermal hr { border: none; border-top: 1px dashed #999; margin: 6px 0 }
.thermal table { width: 100%; font-size: 10px; border-collapse: collapse }
.thermal table td { padding: 1px 0; vertical-align: top }
.thermal .grand { font-size: 13px; font-weight: 700; padding-top: 4px; border-top: 1px solid #000 }

/* ─── RESPONSIVE ─────────────────────────── */
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr }
  .side {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 260px;
    z-index: 60;
    transform: translateX(-100%);
    transition: transform .3s var(--transition);
  }
  .side.on { transform: translateX(0) }
  .menu { display: flex }
  .stage { padding: 18px 16px 40px }
  .top { padding: 14px 16px }
  .crumb h2 { font-size: 15px }
  .field-row, .field-row.three { grid-template-columns: 1fr }
  .modal { max-width: 100% }
  .modal-bg { padding: 12px }
  .panel { padding: 16px }
  .tbl-scroll { margin: 0 -16px; padding: 0 16px }
  .line { grid-template-columns: 2fr 50px 70px 55px 28px; gap: 4px }
  .line input, .line select { padding: 7px 8px; font-size: 11px }
}

.overlay {
  position: fixed; inset: 0;

</style>
</head>
<body>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="brand-mark">◆</div>
      <div class="brand-text">
        <h1>Aurora</h1>
        <p>Business Suite</p>
      </div>
    </div>

    <div class="nav-label">Overview</div>
    <button class="nav-link" data-nav="dashboard"><span class="ic">◈</span>Dashboard</button>

    <div class="nav-label">Money In</div>
    <button class="nav-link" data-nav="invoices"><span class="ic">◧</span>Invoices</button>
    <button class="nav-link" data-nav="estimates"><span class="ic">◇</span>Estimates</button>
    <button class="nav-link" data-nav="payments"><span class="ic">◎</span>Payments</button>

    <div class="nav-label">Money Out</div>
    <button class="nav-link" data-nav="expenses"><span class="ic">▽</span>Expenses</button>
    <button class="nav-link" data-nav="bills"><span class="ic">▥</span>Vendor Bills</button>

    <div class="nav-label">Directory</div>
    <button class="nav-link" data-nav="customers"><span class="ic">☺</span>Customers</button>
    <button class="nav-link" data-nav="vendors"><span class="ic">⚑</span>Vendors</button>
    <button class="nav-link" data-nav="items"><span class="ic">▣</span>Items</button>

    <div class="nav-label">Insights</div>
    <button class="nav-link" data-nav="reports"><span class="ic">▲</span>Reports</button>
    <button class="nav-link" data-nav="settings"><span class="ic">⚙</span>Settings</button>

    <div class="side-foot">Offline · Private · Free</div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="menu" id="menuBtn">☰</button>
      <div class="crumb">
        <h2 id="pageTitle">Dashboard</h2>
        <p id="pageSub">Overview of your business</p>
      </div>
      <div id="topActions"></div>
    </header>
    <div class="stage" id="stage"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═════════════════════════════════════════════════
   AURORA — State
   ═════════════════════════════════════════════════ */
const STATE = {
  customers: [],
  vendors: [],
  items: [],
  invoices: [],
  estimates: [],
  expenses: [],
  bills: [],
  config: {
    bizName: 'My Business',
    gstin: '',
    address: '',
    phone: '',
    email: '',
    stateCode: '27',
    currency: '₹',
    invPrefix: 'INV-',
    invCounter: 1,
    estPrefix: 'EST-',
    estCounter: 1
  }
};

/* ─── Storage ─────────────────────────────── */
let _db = null;

function idb() {
  return new Promise((ok, err) => {
    const r = indexedDB.open('aurora_suite', 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore('s');
    r.onsuccess = e => ok(e.target.result);
    r.onerror = e => err(e.target.error);
  });
}

async function load() {
  try {
    _db = await idb();
    return new Promise(ok => {
      const t = _db.transaction('s', 'readonly');
      const r = t.objectStore('s').get('main');
      r.onsuccess = () => {
        if (r.result) {
          Object.assign(STATE, r.result);
          STATE.config = { ...{
            bizName: 'My Business', gstin: '', address: '', phone: '', email: '',
            stateCode: '27', currency: '₹', invPrefix: 'INV-', invCounter: 1,
            estPrefix: 'EST-', estCounter: 1
          }, r.result.config || {} };
        }
        ok();
      };
      r.onerror = () => ok();
    });
  } catch { return; }
}

async function save() {
  try {
    if (!_db) _db = await idb();
    return new Promise(ok => {
      const t = _db.transaction('s', 'readwrite');
      t.objectStore('s').put(JSON.parse(JSON.stringify(STATE)), 'main');
      t.oncomplete = () => ok();
      t.onerror = () => ok();
    });
  } catch { return; }
}

/* ─── Helpers ─────────────────────────────── */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const nowStr = () => new Date().toLocaleString();
const money = n => STATE.config.currency + (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function toast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on' + (kind ? ' ' + kind : '');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.className = 'toast', 2400);
}

function openModal(html) {
  $('modalBox').innerHTML = html;
  $('modalBg').classList.add('on');
}
function closeModal() {
  $('modalBg').classList.remove('on');
  $('modalBox').innerHTML = '';
}
window.closeModal = closeModal;

/* ─── GST Logic ───────────────────────────── */
function computeTax(lines, customerState) {
  const intra = !customerState || !STATE.config.stateCode || customerState === STATE.config.stateCode;
  let subtotal = 0, cgst = 0, sgst = 0, igst = 0;
  lines.forEach(l => {
    const amount = (Number(l.qty) || 0) * (Number(l.rate) || 0);
    subtotal += amount;
    const tax = amount * (Number(l.gst) || 0) / 100;
    if (intra) { cgst += tax / 2; sgst += tax / 2; }
    else igst += tax;
  });
  return { subtotal, cgst, sgst, igst, taxTotal: cgst + sgst + igst, total: subtotal + cgst + sgst + igst };
}

function paidAmount(inv) {
  return (inv.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0);
}
function balance(inv) {
  return Math.max(0, inv.total - paidAmount(inv));
}
function invStatus(inv) {
  const paid = paidAmount(inv);
  if (paid >= inv.total - 0.01) return 'paid';
  if (paid > 0) return 'partial';
  return 'pending';
}
function pillFor(status) {
  const map = { paid: 'ok', partial: 'warn', pending: 'err', converted: 'ok', open: 'info', unpaid: 'err', draft: 'none' };
  return `<span class="pill ${map[status] || 'none'}">${status}</span>`;
}

/* ═════════════════════════════════════════════════
   NAVIGATION
   ═════════════════════════════════════════════════ */
const PAGES = {
  dashboard: { title: 'Dashboard', sub: 'Overview of your business', render: renderDashboard },
  invoices:  { title: 'Invoices', sub: 'Tax invoices and bills', render: renderInvoices },
  estimates: { title: 'Estimates', sub: 'Quotations and proposals', render: renderEstimates },
  payments:  { title: 'Payments', sub: 'Money received', render: renderPayments },
  expenses:  { title: 'Expenses', sub: 'Business spending', render: renderExpenses },
  bills:     { title: 'Vendor Bills', sub: 'Bills from suppliers', render: renderBills },
  customers: { title: 'Customers', sub: 'Your client directory', render: renderCustomers },
  vendors:   { title: 'Vendors', sub: 'Your supplier directory', render: renderVendors },
  items:     { title: 'Items', sub: 'Products and services', render: renderItems },
  reports:   { title: 'Reports', sub: 'P&L, aging, GST summaries', render: renderReports },
  settings:  { title: 'Settings', sub: 'Configure your business', render: renderSettings }
};

let currentPage = 'dashboard';

function go(page) {
  if (!PAGES[page]) page = 'dashboard';
  currentPage = page;
  document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('on', n.dataset.nav === page));
  $('pageTitle').textContent = PAGES[page].title;
  $('pageSub').textContent = PAGES[page].sub;
  $('side').classList.remove('on');
  $('overlay').classList.remove('on');
  $('stage').innerHTML = '';
  PAGES[page].render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.go = go;

document.querySelectorAll('.nav-link').forEach(n => n.addEventListener('click', () => go(n.dataset.nav)));
$('menuBtn').onclick = () => { $('side').classList.toggle('on'); $('overlay').classList.toggle('on'); };
$('overlay').onclick = () => { $('side').classList.remove('on'); $('overlay').classList.remove('on'); };

/* ═════════════════════════════════════════════════
   DASHBOARD
   ═════════════════════════════════════════════════ */
let dashChart = null;

function renderDashboard() {
  $('topActions').innerHTML = `<button class="cta" onclick="newInvoice()">+ New Invoice</button>`;

  const totalSales = STATE.invoices.reduce((s, i) => s + i.total, 0);
  const totalPaid = STATE.invoices.reduce((s, i) => s + paidAmount(i), 0);
  const outstanding = totalSales - totalPaid;
  const expenses = STATE.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
  const purchases = STATE.bills.reduce((s, b) => s + b.total, 0);
  const net = totalSales - purchases - expenses;

  $('stage').innerHTML = `
    <div class="grid kpi-grid">
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-emerald"></span>Total Sales</div>
        <div class="kpi-value emerald">${money(totalSales)}</div>
        <div class="kpi-note">${STATE.invoices.length} invoice${STATE.invoices.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-rose"></span>Outstanding</div>
        <div class="kpi-value rose">${money(outstanding)}</div>
        <div class="kpi-note">${STATE.invoices.filter(i => invStatus(i) !== 'paid').length} unpaid</div>
      </div>
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-amber"></span>Expenses</div>
        <div class="kpi-value amber">${money(expenses)}</div>
        <div class="kpi-note">${STATE.expenses.length} entr${STATE.expenses.length !== 1 ? 'ies' : 'y'}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-cyan"></span>Purchases</div>
        <div class="kpi-value cyan">${money(purchases)}</div>
        <div class="kpi-note">${STATE.bills.length} bill${STATE.bills.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-violet"></span>Net Profit</div>
        <div class="kpi-value ${net >= 0 ? 'emerald' : 'rose'}">${money(net)}</div>
        <div class="kpi-note">Sales − Purchases − Expenses</div>
      </div>
      <div class="kpi">
        <div class="kpi-label"><span class="dot dot-pink"></span>Customers</div>
        <div class="kpi-value pink">${STATE.customers.length}</div>
        <div class="kpi-note">${STATE.vendors.length} vendors</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Sales Performance</h3>
        <span class="sub">Last 6 months</span>
      </div>
      <div class="chart-wrap"><canvas id="dashChart"></canvas></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Recent Invoices</h3>
        <span class="sub">Latest activity</span>
      </div>
      ${STATE.invoices.length === 0
        ? `<div class="empty">
             <div class="empty-icon">◧</div>
             <div class="empty-title">No invoices yet</div>
             <div class="empty-note">Create your first invoice to start tracking sales.</div>
           </div>`
        : `<div class="tbl-scroll">
            <table class="data">
              <thead>
                <tr><th>Invoice</th><th>Customer</th><th class="num">Total</th><th>Status</th></tr>
              </thead>
              <tbody>
                ${[...STATE.invoices].reverse().slice(0, 6).map(i => `
                  <tr>
                    <td class="name">${esc(i.number)}</td>
                    <td>${esc(i.customerName)}</td>
                    <td class="num">${money(i.total)}</td>
                    <td>${pillFor(invStatus(i))}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
           </div>`}
    </div>
  `;

  // Chart
  const months = [], values = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    const ym = d.toISOString().slice(0, 7);
    months.push(d.toLocaleString('en', { month: 'short' }));
    values.push(STATE.invoices.filter(inv => inv.date?.startsWith(ym)).reduce((s, inv) => s + inv.total, 0));
  }
  const ctx = $('dashChart');
  if (!ctx) return;
  if (dashChart) dashChart.destroy();
  const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 240);
  gradient.addColorStop(0, 'rgba(124,92,255,.7)');
  gradient.addColorStop(1, 'rgba(124,92,255,.05)');
  dashChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        data: values,
        borderColor: '#9b7fff',
        backgroundColor: gradient,
        borderWidth: 2.5,
        fill: true,
        tension: .4,
        pointBackgroundColor: '#08090f',
        pointBorderColor: '#9b7fff',
        pointBorderWidth: 2,
        pointRadius: 5,
        pointHoverRadius: 7
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        backgroundColor: '#1c2030',
        borderColor: 'rgba(255,255,255,.1)',
        borderWidth: 1,
        padding: 12,
        cornerRadius: 10,
        titleColor: '#eef0f8',
        bodyColor: '#9ba0b8',
        callbacks: { label: c => money(c.parsed.y) }
      }},
      scales: {
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(255,255,255,.04)', drawBorder: false },
          ticks: { color: '#5c6180', font: { size: 10 }, callback: v => STATE.config.currency + v }
        },
        x: {
          grid: { display: false },
          ticks: { color: '#5c6180', font: { size: 10 } }
        }
      }
    }
  });
}

/* ═════════════════════════════════════════════════
   CUSTOMERS
   ═════════════════════════════════════════════════ */
function renderCustomers() {
  $('topActions').innerHTML = `<button class="cta" onclick="editCustomer()">+ New Customer</button>`;
  const list = STATE.customers;
  $('stage').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h3>Customers</h3>
        <span class="sub">${list.length} total</span>
      </div>
      ${list.length === 0
        ? `<div class="empty">
             <div class="empty-icon">☺</div>
             <div class="empty-title">No customers yet</div>
             <div class="empty-note">Add customers to start creating invoices.</div>
           </div>`
        : `<div class="tbl-scroll">
            <table class="data">
              <thead>
                <tr><th>Name</th><th>Contact</th><th>GSTIN</th><th class="num">Outstanding</th><th></th></tr>
              </thead>
              <tbody>
                ${list.map(c => {
                  const out = STATE.invoices.filter(i => i.customerId === c.id).reduce((s, i) => s + balance(i), 0);
                  return `<tr>
                    <td>
                      <div class="name">${esc(c.name)}</div>
                      ${c.address ? `<div class="sm">${esc(c.address)}</div>` : ''}
                    </td>
                    <td>
                      ${c.phone ? `<div>${esc(c.phone)}</div>` : ''}
                      ${c.email ? `<div class="sm">${esc(c.email)}</div>` : ''}
                    </td>
                    <td class="sm">${esc(c.gstin || '—')}</td>
                    <td class="num ${out > 0 ? 'rose' : ''}">${money(out)}</td>
                    <td>
                      <div class="row-btns">
                        <button class="row-btn" onclick="editCustomer('${c.id}')" title="Edit">✎</button>
                        <button class="row-btn danger" onclick="deleteCustomer('${c.id}')" title="Delete">✕</button>
                      </div>
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
           </div>`}
    </div>
  `;
}

function editCustomer(id) {
  const c = id ? STATE.customers.find(x => x.id === id) : { name: '', phone: '', email: '', gstin: '', stateCode: '', address: '' };
  openModal(`
    <div class="modal-head">
      <h3>${id ? 'Edit' : 'New'} Customer</h3>
      <button class="x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Full Name <span class="req">*</span></label><input id="c_name" value="${esc(c.name)}" autofocus></div>
      <div class="field-row">
        <div class="field"><label>Phone</label><input id="c_phone" type="tel" value="${esc(c.phone)}"></div>
        <div class="field"><label>Email</label><input id="c_email" type="email" value="${esc(c.email)}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>GSTIN</label><input id="c_gstin" value="${esc(c.gstin)}"></div>
        <div class="field"><label>State Code</label><input id="c_state" value="${esc(c.stateCode)}" placeholder="e.g. 27"></div>
      </div>
      <div class="field"><label>Address</label><textarea id="c_addr">${esc(c.address)}</textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCustomer(${id ? `'${id}'` : 'null'})">Save</button>
    </div>
  `);
}

async function saveCustomer(id) {
  const name = $('c_name').value.trim();
  if (!name) return toast('Name is required', 'err');
  const data = {
    name,
    phone: $('c_phone').value.trim(),
    email: $('c_email').value.trim(),
    gstin: $('c_gstin').value.trim(),
    stateCode: $('c_state').value.trim(),
    address: $('c_addr').value.trim()
  };
  if (id) Object.assign(STATE.customers.find(x => x.id === id), data);
  else STATE.customers.push({ id: uid(), ...data, created: nowStr() });
  await save();
  closeModal();
  toast(id ? 'Customer updated' : 'Customer added', 'ok');
  renderCustomers();
}

async function deleteCustomer(id) {
  if (!confirm('Delete this customer?')) return;
  STATE.customers = STATE.customers.filter(c => c.id !== id);
  await save();
  toast('Customer deleted');
  renderCustomers();
}

/* ═════════════════════════════════════════════════
   VENDORS
   ═════════════════════════════════════════════════ */
function renderVendors() {
  $('topActions').innerHTML = `<button class="cta" onclick="editVendor()">+ New Vendor</button>`;
  const list = STATE.vendors;
  $('stage').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h3>Vendors</h3>
        <span class="sub">${list.length} total</span>
      </div>
      ${list.length === 0
        ? `<div class="empty">
             <div class="empty-icon">⚑</div>
             <div class="empty-title">No vendors yet</div>
             <div class="empty-note">Add suppliers you purchase from.</div>
           </div>`
        : `<div class="tbl-scroll">
            <table class="data">
              <thead>
                <tr><th>Name</th><th>Contact</th><th>GSTIN</th><th></th></tr>
              </thead>
              <tbody>
                ${list.map(v => `<tr>
                  <td><div class="name">${esc(v.name)}</div></td>
                  <td>
                    ${v.phone ? `<div>${esc(v.phone)}</div>` : ''}
                    ${v.email ? `<div class="sm">${esc(v.email)}</div>` : ''}
                  </td>
                  <td class="sm">${esc(v.gstin || '—')}</td>
                  <td>
                    <div class="row-btns">
                      <button class="row-btn" onclick="editVendor('${v.id}')">✎</button>
                      <button class="row-btn danger" onclick="deleteVendor('${v.id}')">✕</button>
                    </div>
                  </td>
                </tr>`).join('')}
              </tbody>
            </table>
           </div>`}
    </div>
  `;
}

function editVendor(id) {
  const v = id ? STATE.vendors.find(x => x.id === id) : { name: '', phone: '', email: '', gstin: '', address: '' };
  openModal(`
    <div class="modal-head">
      <h3>${id ? 'Edit' : 'New'} Vendor</h3>
      <button class="x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Vendor Name <span class="req">*</span></label><input id="v_name" value="${esc(v.name)}" autofocus></div>
      <div class="field-row">
        <div class="field"><label>Phone</label><input id="v_phone" value="${esc(v.phone)}"></div>
        <div class="field"><label>Email</label><input id="v_email" value="${esc(v.email)}"></div>
      </div>
      <div class="field"><label>GSTIN</label><input id="v_gstin" value="${esc(v.gstin)}"></div>
      <div class="field"><label>Address</label><textarea id="v_addr">${esc(v.address)}</textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveVendor(${id ? `'${id}'` : 'null'})">Save</button>
    </div>
  `);
}

async function saveVendor(id) {
  const name = $('v_name').value.trim();
  if (!name) return toast('Name required', 'err');
  const data = {
    name,
    phone: $('v_phone').value.trim(),
    email: $('v_email').value.trim(),
    gstin: $('v_gstin').value.trim(),
    address: $('v_addr').value.trim()
  };
  if (id) Object.assign(STATE.vendors.find(x => x.id === id), data);
  else STATE.vendors.push({ id: uid(), ...data, created: nowStr() });
  await save();
  closeModal();
  toast(id ? 'Vendor updated' : 'Vendor added', 'ok');
  renderVendors();
}

async function deleteVendor(id) {
  if (!confirm('Delete this vendor?')) return;
  STATE.vendors = STATE.vendors.filter(v => v.id !== id);
  await save();
  toast('Vendor deleted');
  renderVendors();
}

/* ═════════════════════════════════════════════════
   ITEMS
   ═════════════════════════════════════════════════ */
function renderItems() {
  $('topActions').innerHTML = `<button class="cta" onclick="editItem()">+ New Item</button>`;
  const list = STATE.items;
  $('stage').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h3>Items & Services</h3>
        <span class="sub">${list.length} total</span>
      </div>
      ${list.length === 0
        ? `<div class="empty">
             <div class="empty-icon">▣</div>
             <div class="empty-title">No items yet</div>
             <div class="empty-note">Add products or services you sell.</div>
           </div>`
        : `<div class="tbl-scroll">
            <table class="data">
              <thead>
                <tr><th>Name</th><th class="num">Rate</th><th class="num">GST</th><th class="num">Stock</th><th></th></tr>
              </thead>
              <tbody>
                ${list.map(it => `<tr>
                  <td>
                    <div class="name">${esc(it.name)}</div>
                    ${it.description ? `<div class="sm">${esc(it.description)}</div>` : ''}
                  </td>
                  <td class="num">${money(it.rate)}</td>
                  <td class="num">${it.gst}%</td>

                    <div class="row-btns">
                      <button class="row-btn" onclick="editItem('${it.id}')">✎</button>
                      <button class="row-btn danger" onclick="deleteItem('${it.id}')">✕</button>
                    </div>
                  </td>
                </tr>`).join('')}
              </tbody>
            </table>
           </div>`}
    </div>
  `;
}

function editItem(id) {
  const it = id ? STATE.items.find(x => x.id === id) : { name: '', description: '', rate: 0, gst: 18, stock: 0, unit: 'pcs' };
  openModal(`
    <div class="modal-head">
      <h3>${id ? 'Edit' : 'New'} Item</h3>
      <button class="x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Name <span class="req">*</span></label><input id="i_name" value="${esc(it.name)}" placeholder="e.g. Design Service" autofocus></div>
      <div class="field"><label>Description</label><input id="i_desc" value="${esc(it.description)}"></div>
      <div class="field-row three">

        <div class="field"><label>GST %</label>
          <select id="i_gst">${[0,5,12,18,28].map(r => `<option value="${r}" ${r==it.gst?'selected':''}>${r}%</option>`).join('')}</select>
        </div>
        <div class="field"><label>Stock Qty</label><input id="i_stock" type="number" value="${it.stock ?? 0}"></div>
      </div>
      <div class="field"><label>Unit</label><input id="i_unit" value="${esc(it.unit || 'pcs')}" placeholder="pcs, kg, hr..."></div>
    </div>

      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem(${id ? `'${id}'` : 'null'})">Save</button>
    </div>
  `);
}

async function saveItem(id) {
  const name = $('i_name').value.trim();
  if (!name) return toast('Name required', 'err');
  const data = {
    name,
    description: $('i_desc').value.trim(),
    rate: Number($('i_rate').value) || 0,
    gst: Number($('i_gst').value) || 0,
    stock: Number($('i_stock').value) || 0,
    unit: $('i_unit').value.trim() || 'pcs'
  };
  if (id) Object.assign(STATE.items.find(x => x.id === id), data);
  else STATE.items.push({ id: uid(), ...data, created: nowStr() });
  await save();
  closeModal();
  toast(id ? 'Item updated' : 'Item added', 'ok');
  renderItems();
}

async function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  STATE.items = STATE.items.filter(x => x.id !== id);
  await save();
  toast('Item deleted');
  renderItems();
}

let lineSeq = 0;

function newInvoice() {
  if (STATE.customers.length === 0) return toast('Add a customer first', 'err');
  lineSeq = 0;
  const custOpts = STATE.customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  window._itemOpts = STATE.items.map(i => `<option value="${i.id}">${esc(i.name)} — ${money(i.rate)}</option>`).join('');

  openModal(`
    <div class="modal-head">
      <h3>New Invoice</h3>
      <button class="x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Customer <span class="req">*</span></label>
          <select id="inv_cust" onchange="recalc()">${custOpts}</select>
        </div>
        <div class="field"><label>Invoice Date</label><input id="inv_date" type="date" value="${today()}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Due Date</label><input id="inv_due" type="date" value="${today()}"></div>
        <div class="field"><label>Notes</label><input id="inv_notes" placeholder="Optional note"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px">
        <label style="font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:.3px">LINE ITEMS</label>
        <button class="btn btn-ghost btn-sm" onclick="addLine()">+ Add</button>
      </div>
      <div class="line-items" id="lines"></div>
      <div class="totals" id="totals"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveInvoice()">Create Invoice</button>
    </div>
  `);
  addLine();
}

function addLine() {
  lineSeq++;
  const id = 'ln' + lineSeq;
  const el = document.createElement('div');
  el.className = 'line';
  el.id = id;
  el.innerHTML = `
    <select class="li-item" onchange="pickItem(this,'${id}')">
      <option value="">— Item —</option>
      ${window._itemOpts || ''}
      <option value="__custom">Custom line...</option>
    </select>
    <input class="li-qty" type="number" value="1" min="0" placeholder="Qty" oninput="recalc()">
    <input class="li-rate" type="number" value="0" min="0" placeholder="Rate" oninput="recalc()">
    <input class="li-gst" type="number" value="18" min="0" placeholder="GST%" oninput="recalc()">
    <button class="rm" onclick="this.parentElement.remove();recalc()">✕</button>
  `;
  $('lines').appendChild(el);
}

function pickItem(sel, lineId) {
  const line = $(lineId);
  const it = STATE.items.find(x => x.id === sel.value);
  if (it) {
    line.querySelector('.li-rate').value = it.rate;
    line.querySelector('.li-gst').value = it.gst;
  }
  recalc();
}

function collectLines() {
  const lines = [];
  document.querySelectorAll('#lines .line').forEach(l => {
    const sel = l.querySelector('.li-item');
    const qty = Number(l.querySelector('.li-qty').value) || 0;
    const rate = Number(l.querySelector('.li-rate').value) || 0;
    const gst = Number(l.querySelector('.li-gst').value) || 0;
    const itemId = sel.value;
    const itemName = itemId && itemId !== '__custom'
      ? (STATE.items.find(x => x.id === itemId)?.name || 'Item')
      : 'Custom item';
    lines.push({ itemId, name: itemName, qty, rate, gst });
  });
  return lines.filter(l => l.qty > 0);
}

function recalc() {
  const lines = collectLines();
  const custId = $('inv_cust')?.value;
  const cust = STATE.customers.find(c => c.id === custId);
  const t = computeTax(lines, cust?.stateCode || '');
  const el = $('totals');
  if (!el) return;
  el.innerHTML = `
    <div class="totals-row"><span>Subtotal</span><b>${money(t.subtotal)}</b></div>
    ${t.cgst ? `<div class="totals-row"><span>CGST</span><b>${money(t.cgst)}</b></div>` : ''}
    ${t.sgst ? `<div class="totals-row"><span>SGST</span><b>${money(t.sgst)}</b></div>` : ''}
    ${t.igst ? `<div class="totals-row"><span>IGST</span><b>${money(t.igst)}</b></div>` : ''}
    <div class="totals-grand"><span>Total</span><span>${money(t.total)}</span></div>
  `;
}

async function saveInvoice() {
  const custId = $('inv_cust').value;
  const cust = STATE.customers.find(c => c.id === custId);
  if (!cust) return toast('Select a customer', 'err');
  const lines = collectLines();
  if (lines.length === 0) return toast('Add at least one line', 'err');
  const t = computeTax(lines, cust.stateCode);
  const num = STATE.config.invPrefix + String(STATE.config.invCounter).padStart(4, '0');

  STATE.invoices.push({
    id: uid(),
    number: num,
    date: $('inv_date').value,
    dueDate: $('inv_due').value,
    customerId: cust.id,
    customerName: cust.name,
    customerGSTIN: cust.gstin || '',
    customerStateCode: cust.stateCode || '',
    items: lines,
    subtotal: t.subtotal,
    cgst: t.cgst, sgst: t.sgst, igst: t.igst,
    total: t.total,
    notes: $('inv_notes').value.trim(),
    payments: [],
    created: nowStr()
  });

  // Decrement stock
  lines.forEach(l => {
    if (l.itemId && l.itemId !== '__custom') {
      const it = STATE.items.find(x => x.id === l.itemId);
      if (it && it.stock != null) it.stock = Math.max(0, it.stock - l.qty);
    }
  });

  STATE.config.invCounter++;
  await save();
  closeModal();
  toast('Invoice ' + num + ' created', 'ok');
  renderInvoices();
}

async function savePayment(invId) {
  const inv = STATE.invoices.find(x => x.id === invId);
  if (!inv) return;
  const amt = Number($('p_amt').value) || 0;
  if (amt <= 0) return toast('Invalid amount', 'err');
  inv.payments = inv.payments || [];
  inv.payments.push({
    id: uid(),
    date: $('p_date').value,
    amount: amt,
    method: $('p_method').value,
    reference: $('p_ref').value.trim(),
    recorded: nowStr()
  });
  await save();
  closeModal();
  toast('Payment recorded', 'ok');
  if (currentPage === 'dashboard') renderDashboard();
  else if (currentPage === 'invoices') renderInvoices();
  else if (currentPage === 'payments') renderPayments();
}

function pdfInvoice(id) {
  const inv = STATE.invoices.find(x => x.id === id);
  if (!inv) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const c = STATE.config;

  doc.setFontSize(20);
  doc.setFont(undefined, 'bold');
  doc.text(c.bizName || 'My Business', 14, 22);

  doc.setFontSize(9);
  doc.setFont(undefined, 'normal');
  let y = 29;
  if (c.address) { doc.text(c.address, 14, y); y += 5; }
  if (c.gstin) { doc.text('GSTIN: ' + c.gstin, 14, y); y += 5; }
  if (c.phone) { doc.text('Phone: ' + c.phone, 14, y); y += 5; }

  doc.setFontSize(16);
  doc.setFont(undefined, 'bold');
  doc.text('TAX INVOICE', 196, 22, { align: 'right' });
  doc.setFontSize(10);
  doc.setFont(undefined, 'normal');
  doc.text(inv.number, 196, 29, { align: 'right' });
  doc.text('Date: ' + inv.date, 196, 34, { align: 'right' });
  doc.text('Due: ' + inv.dueDate, 196, 39, { align: 'right' });

  y = Math.max(y, 44) + 6;
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text('BILL TO', 14, y);
  doc.setTextColor(0);
  y += 6;
  doc.setFontSize(12);
  doc.setFont(undefined, 'bold');
  doc.text(inv.customerName, 14, y);
  y += 5;
  doc.setFont(undefined, 'normal');
  doc.setFontSize(9);
  if (inv.customerGSTIN) { doc.text('GSTIN: ' + inv.customerGSTIN, 14, y); y += 4; }

  y += 6;
  doc.autoTable({
    startY: y,
    head: [['Item', 'Qty', 'Rate', 'GST%', 'Amount']],
    body: inv.items.map(it => [it.name, String(it.qty), money(it.rate), it.gst + '%', money(it.qty * it.rate)]),
    theme: 'grid',
    headStyles: { fillColor: [124, 92, 255], fontSize: 9 },
    bodyStyles: { fontSize: 9 },
    columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } }
  });

  let ey = doc.lastAutoTable.finalY + 8;
  const lx = 130, vx = 196;
  doc.setFontSize(9);
  doc.text('Subtotal', lx, ey); doc.text(money(inv.subtotal), vx, ey, { align: 'right' }); ey += 5;
  if (inv.cgst) { doc.text('CGST', lx, ey); doc.text(money(inv.cgst), vx, ey, { align: 'right' }); ey += 5; }
  if (inv.sgst) { doc.text('SGST', lx, ey); doc.text(money(inv.sgst), vx, ey, { align: 'right' }); ey += 5; }
  if (inv.igst) { doc.text('IGST', lx, ey); doc.text(money(inv.igst), vx, ey, { align: 'right' }); ey += 5; }
  doc.line(lx, ey, vx, ey); ey += 6;
  doc.setFontSize(12); doc.setFont(undefined, 'bold');
  doc.text('Total', lx, ey); doc.text(money(inv.total), vx, ey, { align: 'right' });

  doc.save(inv.number + '.pdf');
  toast('PDF downloaded', 'ok');
}

function renderEstimates() {
  $('topActions').innerHTML = `<button class="cta" onclick="newEstimate()">+ New Estimate</button>`;

async function saveEstimate() {
  const custId = $('inv_cust').value;
  const cust = STATE.customers.find(c => c.id === custId);
  if (!cust) return toast('Select a customer', 'err');
  const lines = collectLines();
  if (lines.length === 0) return toast('Add at least one line', 'err');
  const t = computeTax(lines, cust.stateCode);
  const num = STATE.config.estPrefix + String(STATE.config.estCounter).padStart(4, '0');

  STATE.estimates.push({
    id: uid(),
    number: num,
    date: $('inv_date').value,
    customerId: cust.id,
    customerName: cust.name,
    items: lines,
    subtotal: t.subtotal,
    cgst: t.cgst, sgst: t.sgst, igst: t.igst,
    total: t.total,
    converted: false,
    created: nowStr()
  });
  STATE.config.estCounter++;
  await save();
  closeModal();
  toast('Estimate ' + num + ' saved', 'ok');
  renderEstimates();
}

async function convertEstimate(id) {
  const est = STATE.estimates.find(x => x.id === id);
  if (!est) return;
  if (!confirm('Convert ' + est.number + ' to an invoice?')) return;
  const cust = STATE.customers.find(c => c.id === est.customerId);
  const t = computeTax(est.items, cust?.stateCode || '');
  const num = STATE.config.invPrefix + String(STATE.config.invCounter).padStart(4, '0');

  STATE.invoices.push({
    id: uid(),
    number: num,
    date: today(), dueDate: today(),
    customerId: est.customerId,
    customerName: est.customerName,
    customerGSTIN: cust?.gstin || '',
    customerStateCode: cust?.stateCode || '',
    items: est.items,
    subtotal: t.subtotal,
    cgst: t.cgst, sgst: t.sgst, igst: t.igst,
    total: t.total,
    notes: 'Converted from ' + est.number,
    payments: [],
    created: nowStr()
  });
  STATE.config.invCounter++;
  est.converted = true;
  est.convertedTo = num;
  await save();
  toast('Converted to ' + num, 'ok');
  go('invoices');
}

async function deleteEstimate(id) {
  if (!confirm('Delete this estimate?')) return;
  STATE.estimates = STATE.estimates.filter(e => e.id !== id);
  await save();
  toast('Estimate deleted');
  renderEstimates();
}

   REPORTS
   ═════════════════════════════════════════════════ */
function renderReports() {
  $('topActions').innerHTML = '';
  const totalSales = STATE.invoices.reduce((s, i) => s + i.total, 0);
  const totalPurchases = STATE.bills.reduce((s, b) => s + b.total, 0);
  const totalExpenses = STATE.expenses.reduce((s, e) => s + e.amount, 0);
  const gross = totalSales - totalPurchases;
  const net = gross - totalExpenses;
  const gstOut = STATE.invoices.reduce((s, i) => s + i.cgst + i.sgst + i.igst, 0);

  const aging = { a: 0, b: 0, c: 0, d: 0 };
  STATE.invoices.forEach(inv => {
    const bal = balance(inv);
    if (bal <= 0) return;
    const days = Math.ceil((new Date() - new Date(inv.date)) / 86400000);
    if (days <= 30) aging.a += bal;
    else if (days <= 60) aging.b += bal;
    else if (days <= 90) aging.c += bal;
    else aging.d += bal;
  });

  $('stage').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3>Profit & Loss</h3></div>
      <div style="font-size:13px">
        <div class="totals-row"><span>Revenue</span><b class="emerald">${money(totalSales)}</b></div>
        <div class="totals-row"><span>Cost of Purchases</span><b class="rose">− ${money(totalPurchases)}</b></div>
        <div class="totals-row" style="border-top:1px solid var(--line);padding-top:10px;margin-top:6px"><span><b>Gross Profit</b></span><b>${money(gross)}</b></div>
        <div class="totals-row"><span>Operating Expenses</span><b class="rose">− ${money(totalExpenses)}</b></div>
        <div class="totals-grand"><span>Net Profit</span><span class="${net >= 0 ? 'emerald' : 'rose'}">${money(net)}</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Receivables Aging</h3></div>
      <div class="tbl-scroll" style="margin:0">
        <table class="data" style="min-width:auto">
          <thead><tr><th>Age Bucket</th><th class="num">Amount</th></tr></thead>
          <tbody>
            <tr><td>0 – 30 days</td><td class="num emerald">${money(aging.a)}</td></tr>
            <tr><td>31 – 60 days</td><td class="num amber">${money(aging.b)}</td></tr>
            <tr><td>61 – 90 days</td><td class="num rose">${money(aging.c)}</td></tr>
            <tr><td>90+ days</td><td class="num rose">${money(aging.d)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>GST Summary</h3></div>
      <div style="font-size:13px">
        <div class="totals-row"><span>GST Collected (Output)</span><b>${money(gstOut)}</b></div>
        <div class="totals-row"><span>GST Paid (Input)</span><b>${money(0)}</b></div>
        <div class="totals-grand"><span>Net GST Payable</span><span class="amber">${money(gstOut)}</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Export</h3></div>
      <div class="btn-row" style="justify-content:flex-start">
        <button class="btn btn-ghost" onclick="exportCSV()">📊 Invoices CSV</button>
        <button class="btn btn-ghost" onclick="exportGST()">🧾 GSTR-1 CSV</button>
        <button class="btn btn-ghost" onclick="exportBackup()">💾 Full Backup</button>
      </div>
    </div>
  `;
}

function exportCSV() {
  let csv = 'Invoice,Date,Customer,Subtotal,CGST,SGST,IGST,Total,Status\n';
  STATE.invoices.forEach(i => {
    csv += `"${i.number}","${i.date}","${i.customerName}",${i.subtotal.toFixed(2)},${i.cgst.toFixed(2)},${i.sgst.toFixed(2)},${i.igst.toFixed(2)},${i.total.toFixed(2)},"${invStatus(i)}"\n`;
  });
  dl(new Blob([csv], { type: 'text/csv' }), 'invoices_' + today() + '.csv');
  toast('CSV exported', 'ok');
}

function exportGST() {
  let csv = 'GSTIN,Invoice,Date,Customer,Taxable,CGST,SGST,IGST,Total\n';
  STATE.invoices.filter(i => i.cgst || i.sgst || i.igst).forEach(i => {
    csv += `"${STATE.config.gstin}","${i.number}","${i.date}","${i.customerName}",${i.subtotal.toFixed(2)},${i.cgst.toFixed(2)},${i.sgst.toFixed(2)},${i.igst.toFixed(2)},${i.total.toFixed(2)}\n`;
  });
  dl(new Blob([csv], { type: 'text/csv' }), 'GSTR1_' + today() + '.csv');
  toast('GSTR-1 exported', 'ok');
}

function exportBackup() {
  dl(new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' }), 'aurora_backup_' + today() + '.json');
  toast('Backup downloaded', 'ok');
}

function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

    phone: $('s_phone').value.trim(),
    email: $('s_email').value.trim(),
    address: $('s_addr').value.trim(),
    stateCode: $('s_state').value.trim(),
    currency: $('s_curr').value.trim() || '₹',
    invPrefix: $('s_invpre').value.trim() || 'INV-',
    invCounter: Number($('s_invcnt').value) || 1,
    estPrefix: $('s_estpre').value.trim() || 'EST-',
    estCounter: Number($('s_estcnt').value) || 1
  });
  await save();
  toast('Settings saved', 'ok');
}

async function importFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!confirm('Replace all current data with this backup?')) return;
    Object.assign(STATE, data);
    await save();
    toast('Backup restored', 'ok');
    go('dashboard');
  } catch { toast('Invalid backup file', 'err'); }
}

async function resetAll() {
  if (!confirm('Delete ALL data? This cannot be undone.')) return;
  if (!confirm('Are you absolutely sure?')) return;
  Object.keys(STATE).forEach(k => {
    if (Array.isArray(STATE[k])) STATE[k] = [];
  });
  STATE.config = {
    bizName: 'My Business', gstin: '', address: '', phone: '', email: '',
    stateCode: '27', currency: '₹', invPrefix: 'INV-', invCounter: 1,
    estPrefix: 'EST-', estCounter: 1
  };
  await save();
  toast('All data cleared', 'ok');
  go('dashboard');
}

/* ═════════════════════════════════════════════════
   EXPOSE + BOOT
   ═════════════════════════════════════════════════ */
Object.assign(window, {
  editCustomer, saveCustomer, deleteCustomer,
  editVendor, saveVendor, deleteVendor,
  editItem, saveItem, deleteItem,
  newInvoice, addLine, pickItem, recalc, saveInvoice, viewInvoice, deleteInvoice, recordPayment, savePayment, pdfInvoice, thermal,
  newEstimate, saveEstimate, convertEstimate, deleteEstimate,
  newExpense, saveExpense, deleteExpense,
  newBill, saveBill, markBillPaid, deleteBill,
  saveSettings, importFile, resetAll,
  exportCSV, exportGST, exportBackup
});

(async function boot() {
  await load();
  go('dashboard');
})();
</script>
</body>
