<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<title>Ledger — Simple Business Manager</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf@2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable@3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0a14;--panel:#11111c;--panel2:#17172a;--line:#232338;
--text:#eeeef7;--dim:#8b8ba8;--faint:#4a4a68;
--blue:#4f7cff;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;
--cyan:#06b6d4;--purple:#a855f7;
--r:10px;--rs:7px;
}
html{font-size:16px}
body{
font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
width:230px;background:var(--panel);border-right:1px solid var(--line);
padding:18px 0;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50;
transition:transform .25s;
}
.sidebar.hidden{transform:translateX(-100%)}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px}
.brand p{font-size:11px;color:var(--dim);margin-top:2px}
.nav-item{
display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;
color:var(--dim);cursor:pointer;border-left:3px solid transparent;transition:.15s;
}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:rgba(79,124,255,.08);color:var(--blue);border-left-color:var(--blue)}
.nav-item .ico{font-size:15px;width:20px;text-align:center}
.nav-sec{padding:14px 20px 6px;font-size:10px;font-weight:700;color:var(--faint);letter-spacing:1px;text-transform:uppercase}

/* MAIN */
.main{flex:1;margin-left:230px;min-width:0;display:flex;flex-direction:column}
.topbar{
height:56px;background:var(--panel);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:40;
}
.menu-btn{
display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;
}
.topbar h2{font-size:15px;font-weight:600;flex:1}
.topbar .act{
padding:7px 14px;background:var(--blue);color:#fff;border:none;border-radius:var(--rs);
font-size:12px;font-weight:600;cursor:pointer;transition:.15s;
}
.topbar .act:hover{background:#3d6ae8}
.topbar .ghost{
padding:7px 12px;background:transparent;color:var(--dim);border:1px solid var(--line);
border-radius:var(--rs);font-size:12px;cursor:pointer;font-weight:600;
}
.topbar .ghost:hover{color:var(--text);border-color:var(--dim)}
.content{padding:22px;flex:1}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .hint{font-weight:400;font-size:11px;color:var(--dim);margin-left:auto}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .lab{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.kpi .val{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .sub{font-size:11px;color:var(--faint);margin-top:4px}
.kpi.g .val{color:var(--green)}.kpi.r .val{color:var(--red)}.kpi.a .val{color:var(--amber)}
.kpi.b .val{color:var(--blue)}.kpi.c .val{color:var(--cyan)}.kpi.p .val{color:var(--purple)}

/* TABLES */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
.tbl th{
text-align:left;padding:10px 10px;font-size:10px;font-weight:700;color:var(--faint);
letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid var(--line);
}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .name{font-weight:600;color:var(--text)}
.tbl .sm{font-size:11px;color:var(--dim)}
.row-act{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{
background:none;border:none;padding:4px 6px;color:var(--dim);cursor:pointer;
font-size:13px;border-radius:var(--rs);transition:.15s;
}
.icon-btn:hover{background:var(--panel2);color:var(--text)}

/* BADGES */
.badge{
display:inline-block;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;
letter-spacing:.3px;text-transform:uppercase;
}
.badge.g{background:rgba(34,197,94,.15);color:var(--green)}
.badge.r{background:rgba(239,68,68,.15);color:var(--red)}
.badge.a{background:rgba(245,158,11,.15);color:var(--amber)}
.badge.b{background:rgba(79,124,255,.15);color:var(--blue)}
.badge.n{background:rgba(139,139,168,.12);color:var(--dim)}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.one{grid-template-columns:1fr}
.form-grid.three{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.3px}
.field input,.field select,.field textarea{
padding:9px 11px;background:var(--bg);border:1px solid var(--line);
border-radius:var(--rs);color:var(--text);font-size:13px;font-family:inherit;outline:none;
transition:.15s;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field textarea{min-height:70px;resize:vertical}
.field .req{color:var(--red)}

/* BUTTONS */
.btn{
padding:9px 16px;border:none;border-radius:var(--rs);font-size:13px;font-weight:600;
cursor:pointer;font-family:inherit;transition:.15s;
}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#3d6ae8}
.btn.success{background:var(--green);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line)}
.btn.tiny{padding:5px 10px;font-size:11px}
.btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

/* MODAL */
.modal-bg{
position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;
}
.modal-bg.on{display:flex}
.modal{
background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
width:100%;max-width:640px;margin:auto;
}
.modal-head{
padding:16px 20px;border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{font-size:14px;font-weight:700}
.modal-close{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;line-height:1}
.modal-body{padding:20px}
.modal-foot{
padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;
}

/* TOAST */
.toast{
position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
background:var(--panel2);border:1px solid var(--line);color:var(--text);
padding:11px 20px;border-radius:var(--rs);font-size:13px;font-weight:600;
z-index:200;transition:transform .3s;pointer-events:none;
}
.toast.on{transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--faint);font-size:13px}
.empty .big{font-size:36px;display:block;margin-bottom:10px}

/* SEARCH */
.search{
padding:8px 12px;background:var(--bg);border:1px solid var(--line);
border-radius:var(--rs);color:var(--text);font-size:13px;width:200px;outline:none;
}
.search:focus{border-color:var(--blue)}

/* CHART */
.chart-box{position:relative;height:220px}

/* THERMAL */
.thermal{
background:#fff;color:#000;padding:12px;font-family:'Courier New',monospace;
font-size:11px;line-height:1.5;max-width:300px;margin:0 auto;
}
.thermal .c{text-align:center}
.thermal hr{border:none;border-top:1px dashed #666;margin:5px 0}
.thermal table{width:100%;font-size:10px}
.thermal table td{padding:1px 0}
.thermal .total{font-weight:700;font-size:12px}

/* MOBILE */
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.menu-btn{display:block}
.topbar h2{font-size:13px}
.content{padding:14px}
.form-grid,.form-grid.three{grid-template-columns:1fr}
.kpi .val{font-size:18px}
.card{padding:14px}
}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <h1>📒 Ledger</h1>
    <p>Simple business manager</p>
  </div>
  <div class="nav-sec">Main</div>
  <div class="nav-item" data-route="dashboard"><span class="ico">▦</span>Dashboard</div>
  <div class="nav-item" data-route="invoices"><span class="ico">▤</span>Invoices</div>
  <div class="nav-item" data-route="estimates"><span class="ico">◆</span>Estimates</div>
  <div class="nav-item" data-route="payments"><span class="ico">◎</span>Payments</div>
  <div class="nav-item" data-route="expenses"><span class="ico">▽</span>Expenses</div>
  <div class="nav-sec">Contacts</div>
  <div class="nav-item" data-route="customers"><span class="ico">☺</span>Customers</div>
  <div class="nav-item" data-route="vendors"><span class="ico">⚑</span>Vendors</div>
  <div class="nav-sec">Inventory</div>
  <div class="nav-item" data-route="items"><span class="ico">▣</span>Items</div>
  <div class="nav-item" data-route="bills"><span class="ico">▥</span>Vendor Bills</div>
  <div class="nav-sec">Insights</div>
  <div class="nav-item" data-route="reports"><span class="ico">▲</span>Reports</div>
  <div class="nav-item" data-route="settings"><span class="ico">⚙</span>Settings</div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <h2 id="pageTitle">Dashboard</h2>
    <div id="topActions"></div>
  </header>
  <div class="content" id="content"></div>
</main>

</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════
   Ledger — Simple Business Manager
   Everything runs in the browser. Data in IndexedDB.
   ══════════════════════════════════════════════ */

/* ── STATE ─────────────────────────────── */
const S = {
  customers: [], vendors: [], items: [],
  invoices: [], estimates: [], payments: [],
  expenses: [], bills: [],
  settings: {
    name: 'My Business', gstin: '', address: '', phone: '', email: '',
    stateCode: '27', invPrefix: 'INV-', invCounter: 1,
    estPrefix: 'EST-', estCounter: 1, currency: '₹'
  }
};

/* ── PERSISTENCE ───────────────────────── */
const DB_NAME = 'ledger_db';
let _db = null;

function openDB() {
  return new Promise((ok, err) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('state')) db.createObjectStore('state');
    };
    req.onsuccess = e => ok(e.target.result);
    req.onerror = e => err(e.target.error);
  });
}

async function loadState() {
  _db = await openDB();
  return new Promise(ok => {
    const tx = _db.transaction('state', 'readonly');
    const req = tx.objectStore('state').get('data');
    req.onsuccess = () => {
      if (req.result) {
        Object.assign(S, req.result);
        S.settings = Object.assign({}, {
          name: 'My Business', gstin: '', address: '', phone: '', email: '',
          stateCode: '27', invPrefix: 'INV-', invCounter: 1,
          estPrefix: 'EST-', estCounter: 1, currency: '₹'
        }, req.result.settings || {});
      }
      ok();
    };
    req.onerror = () => ok();
  });
}

async function saveState() {
  if (!_db) _db = await openDB();
  return new Promise(ok => {
    const tx = _db.transaction('state', 'readwrite');
    tx.objectStore('state').put(JSON.parse(JSON.stringify(S)), 'data');
    tx.oncomplete = () => ok();
    tx.onerror = () => ok();
  });
}

/* ── HELPERS ───────────────────────────── */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const nowStr = () => new Date().toLocaleString();

function money(n) {
  const v = Number(n) || 0;
  return S.settings.currency + v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('on'), 2200);
}

function openModal(html) {
  $('modalBox').innerHTML = html;
  $('modalBg').classList.add('on');
}
function closeModal() {
  $('modalBg').classList.remove('on');
  $('modalBox').innerHTML = '';
}
window.closeModal = closeModal;

/* ── GST CALC ──────────────────────────── */
function calcInvoice(items, customerStateCode) {
  let subtotal = 0, cgst = 0, sgst = 0, igst = 0;
  items.forEach(it => {
    const amount = (Number(it.qty) || 0) * (Number(it.rate) || 0);
    subtotal += amount;
    const tax = amount * (Number(it.gst) || 0) / 100;
    const interState = customerStateCode && customerStateCode !== S.settings.stateCode;
    if (interState) igst += tax;
    else { cgst += tax / 2; sgst += tax / 2; }
  });
  const total = subtotal + cgst + sgst + igst;
  return { subtotal, cgst, sgst, igst, total, taxTotal: cgst + sgst + igst };
}

/* ── INVOICE STATUS ────────────────────── */
function invoiceStatus(inv) {
  const paid = (inv.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0);
  if (paid >= inv.total - 0.01) return 'paid';
  if (paid > 0) return 'partial';
  return 'pending';
}
function invoiceBalance(inv) {
  const paid = (inv.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0);
  return Math.max(0, inv.total - paid);
}

/* ── ROUTER ────────────────────────────── */
const ROUTES = {
  dashboard: renderDashboard,
  invoices: renderInvoices,
  estimates: renderEstimates,
  payments: renderPayments,
  expenses: renderExpenses,
  customers: renderCustomers,
  vendors: renderVendors,
  items: renderItems,
  bills: renderBills,
  reports: renderReports,
  settings: renderSettings
};
let currentRoute = 'dashboard';

function navigate(route) {
  if (!ROUTES[route]) route = 'dashboard';
  currentRoute = route;
  document.querySelectorAll('.nav-item').forEach(n =>
    n.classList.toggle('active', n.dataset.route === route));
  $('sidebar').classList.remove('open');
  const titles = {
    dashboard: 'Dashboard', invoices: 'Invoices', estimates: 'Estimates',
    payments: 'Payments', expenses: 'Expenses', customers: 'Customers',
    vendors: 'Vendors', items: 'Items', bills: 'Vendor Bills',
    reports: 'Reports', settings: 'Settings'
  };
  $('pageTitle').textContent = titles[route] || 'Dashboard';
  ROUTES[route]();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.nav-item').forEach(n =>
  n.addEventListener('click', () => navigate(n.dataset.route)));

/* ══════════════════════════════════════════
   DASHBOARD
   ══════════════════════════════════════════ */
let dashChart = null;

function renderDashboard() {
  const totalSales = S.invoices.reduce((s, i) => s + i.total, 0);
  const totalPaid = S.invoices.reduce((s, i) => s + (i.payments || []).reduce((a, p) => a + Number(p.amount || 0), 0), 0);
  const outstanding = totalSales - totalPaid;
  const totalExpenses = S.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
  const totalPurchases = S.bills.reduce((s, b) => s + b.total, 0);
  const netProfit = totalSales - totalPurchases - totalExpenses;
  const paidInvCount = S.invoices.filter(i => invoiceStatus(i) === 'paid').length;
  const pendingCount = S.invoices.filter(i => invoiceStatus(i) !== 'paid').length;

  $('topActions').innerHTML = `<button class="act" onclick="newInvoice()">+ New Invoice</button>`;

  $('content').innerHTML = `
    <div class="kpis">
      <div class="kpi g"><div class="lab">Total Sales</div><div class="val">${money(totalSales)}</div><div class="sub">${S.invoices.length} invoices</div></div>
      <div class="kpi r"><div class="lab">Outstanding</div><div class="val">${money(outstanding)}</div><div class="sub">${pendingCount} unpaid</div></div>
      <div class="kpi a"><div class="lab">Expenses</div><div class="val">${money(totalExpenses)}</div><div class="sub">${S.expenses.length} entries</div></div>
      <div class="kpi b"><div class="lab">Purchases</div><div class="val">${money(totalPurchases)}</div><div class="sub">${S.bills.length} bills</div></div>
      <div class="kpi c"><div class="lab">Net Profit</div><div class="val" style="color:${netProfit >= 0 ? 'var(--green)' : 'var(--red)'}">${money(netProfit)}</div><div class="sub">Sales − Purch − Exp</div></div>
      <div class="kpi p"><div class="lab">Paid Invoices</div><div class="val">${paidInvCount}</div><div class="sub">of ${S.invoices.length}</div></div>
    </div>

    <div class="card">
      <h3>📈 Sales — Last 6 Months</h3>
      <div class="chart-box"><canvas id="dashChart"></canvas></div>
    </div>

    <div class="card">
      <h3>Recent Invoices <span class="hint">Latest 5</span></h3>
      ${S.invoices.length === 0
        ? `<div class="empty"><span class="big">▤</span>No invoices yet. Create your first one.</div>`
        : `<div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Number</th><th>Customer</th><th class="num">Total</th><th>Status</th></tr></thead>
            <tbody>
              ${[...S.invoices].reverse().slice(0, 5).map(i => {
                const st = invoiceStatus(i);
                const cls = st === 'paid' ? 'g' : st === 'partial' ? 'a' : 'r';
                return `<tr>
                  <td class="name">${esc(i.number)}</td>
                  <td>${esc(i.customerName)}</td>
                  <td class="num">${money(i.total)}</td>
                  <td><span class="badge ${cls}">${st}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table></div>`}
    </div>
  `;

  // Chart
  const months = [], sales = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setMonth(d.getMonth() - i);
    const ym = d.toISOString().slice(0, 7);
    months.push(d.toLocaleString('en', { month: 'short' }));
    sales.push(S.invoices.filter(inv => inv.date?.startsWith(ym)).reduce((s, inv) => s + inv.total, 0));
  }
  const ctx = $('dashChart');
  if (ctx) {
    if (dashChart) dashChart.destroy();
    dashChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: months,
        datasets: [{
          data: sales,
          backgroundColor: 'rgba(79,124,255,.7)',
          borderRadius: 6,
          borderWidth: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: {
            beginAtZero: true,
            grid: { color: 'rgba(255,255,255,.05)' },
            ticks: { color: '#8b8ba8', font: { size: 10 } }
          },
          x: {
            grid: { display: false },
            ticks: { color: '#8b8ba8', font: { size: 10 } }
          }
        }
      }
    });
  }
}

/* ══════════════════════════════════════════
   CUSTOMERS
   ══════════════════════════════════════════ */
function renderCustomers() {
  $('topActions').innerHTML = `<button class="act" onclick="editCustomer()">+ New Customer</button>`;
  $('content').innerHTML = `
    <div class="card">
      <h3>Customers <span class="hint">${S.customers.length} total</span></h3>
      ${S.customers.length === 0
        ? `<div class="empty"><span class="big">☺</span>No customers yet. Add your first one.</div>`
        : `<div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Name</th><th>Phone</th><th>GSTIN</th><th class="num">Outstanding</th><th></th></tr></thead>
            <tbody>
              ${S.customers.map(c => {
                const out = S.invoices.filter(i => i.customerId === c.id)
                  .reduce((s, i) => s + invoiceBalance(i), 0);
                return `<tr>
                  <td><div class="name">${esc(c.name)}</div><div class="sm">${esc(c.email || '')}</div></td>

      <option value="">— Select item —</option>${window._itemOpts}
      <option value="__custom">Custom line...</option>
    </select>
    <input class="li-qty" type="number" value="1" min="0" placeholder="Qty" oninput="recalcInvoice()"
      style="padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12px">
    <input class="li-rate" type="number" value="0" min="0" placeholder="Rate" oninput="recalcInvoice()"
      style="padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12px">
    <input class="li-gst" type="number" value="18" min="0" placeholder="GST%" oninput="recalcInvoice()"
      style="padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12px">
    <button class="icon-btn" onclick="this.parentElement.remove();recalcInvoice()" title="Remove">✕</button>
  `;

}

function pickItem(sel, lineId) {
  const line = $(lineId);
  const item = S.items.find(i => i.id === sel.value);
  if (item) {
    line.querySelector('.li-rate').value = item.rate;
    line.querySelector('.li-gst').value = item.gst;
  }
  recalcInvoice();
}

function recalcInvoice() {
  const lines = [];
  document.querySelectorAll('#lineItems > div').forEach(d => {
    const sel = d.querySelector('.li-item');
    const qty = Number(d.querySelector('.li-qty').value) || 0;
    const rate = Number(d.querySelector('.li-rate').value) || 0;
    const gst = Number(d.querySelector('.li-gst').value) || 0;
    const itemId = sel.value;
    const itemName = itemId && itemId !== '__custom'
      ? (S.items.find(i => i.id === itemId)?.name || 'Item')
      : (sel.options[sel.selectedIndex]?.text || 'Item');
    lines.push({ itemId, name: itemName, qty, rate, gst });
  });
  const custId = $('inv_cust')?.value;
  const cust = S.customers.find(c => c.id === custId);
  const calc = calcInvoice(lines, cust?.stateCode || '');
  if ($('t_sub')) $('t_sub').textContent = money(calc.subtotal);
  if ($('t_cgst')) $('t_cgst').textContent = money(calc.cgst);
  if ($('t_sgst')) $('t_sgst').textContent = money(calc.sgst);
  if ($('t_igst')) $('t_igst').textContent = money(calc.igst);
  if ($('t_total')) $('t_total').textContent = money(calc.total);
}

async function saveInvoice() {
  const custId = $('inv_cust').value;
  const cust = S.customers.find(c => c.id === custId);
  if (!cust) return toast('Select a customer');

  const lines = [];
  document.querySelectorAll('#lineItems > div').forEach(d => {
    const sel = d.querySelector('.li-item');
    const qty = Number(d.querySelector('.li-qty').value) || 0;
    const rate = Number(d.querySelector('.li-rate').value) || 0;
    if (qty <= 0) return;
    const gst = Number(d.querySelector('.li-gst').value) || 0;
    const itemId = sel.value;
    const itemName = itemId && itemId !== '__custom'
      ? (S.items.find(i => i.id === itemId)?.name || 'Item')
      : 'Custom item';
    lines.push({ itemId, name: itemName, qty, rate, gst });
  });

  if (lines.length === 0) return toast('Add at least one line item');

  const calc = calcInvoice(lines, cust.stateCode);
  const invNum = S.settings.invPrefix + String(S.settings.invCounter).padStart(4, '0');

  S.invoices.push({
    id: uid(),
    number: invNum,
    date: $('inv_date').value,
    dueDate: $('inv_due').value,
    customerId: cust.id,
    customerName: cust.name,
    customerGSTIN: cust.gstin || '',
    customerStateCode: cust.stateCode || '',
    items: lines,
    subtotal: calc.subtotal,
    cgst: calc.cgst, sgst: calc.sgst, igst: calc.igst,
    total: calc.total,
    notes: $('inv_notes').value.trim(),
    payments: [],
    created: nowStr()
  });

  // Decrease stock
  lines.forEach(l => {
    if (l.itemId && l.itemId !== '__custom') {
      const it = S.items.find(i => i.id === l.itemId);
      if (it && it.stock != null) it.stock = Math.max(0, it.stock - l.qty);
    }
  });

  S.settings.invCounter++;
  await saveState();
  closeModal();
  toast('Invoice ' + invNum + ' created');
  renderInvoices();
}

      </div>

      ${inv.notes ? `<div style="margin-top:12px;font-size:12px"><div style="color:var(--dim);font-size:10px;text-transform:uppercase">Notes</div><div style="margin-top:3px">${esc(inv.notes)}</div></div>` : ''}

      ${(inv.payments || []).length > 0 ? `
        <div style="margin-top:14px">

            <div style="display:flex;justify-content:space-between;padding:6px 10px;background:var(--panel2);border-radius:6px;margin-bottom:4px;font-size:12px">

      <button class="btn ghost" onclick="closeModal()">Close</button>

      <button class="btn ghost" onclick="downloadInvoicePDF('${inv.id}')">⬇ PDF</button>
      ${bal > 0 ? `<button class="btn success" onclick="recordPayment('${inv.id}')">Record Payment</button>` : ''}
    </div>
  `);
}

async function deleteInvoice(id) {
  if (!confirm('Delete this invoice permanently?')) return;
  S.invoices = S.invoices.filter(i => i.id !== id);
  await saveState();
  toast('Invoice deleted');
  renderInvoices();
}

function recordPayment(invId) {
  const inv = S.invoices.find(x => x.id === invId);
  if (!inv) return;
  const bal = invoiceBalance(inv);
  openModal(`
    <div class="modal-head">
      <h3>Record Payment</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--dim);margin-bottom:14px">
        Invoice ${esc(inv.number)} · Balance ${money(bal)}
      </div>
      <div class="form-grid">
        <div class="field"><label>Amount</label><input id="p_amt" type="number" value="${bal.toFixed(2)}" step="0.01"></div>
        <div class="field"><label>Date</label><input id="p_date" type="date" value="${today()}"></div>
        <div class="field"><label>Method</label>
          <select id="p_method">
            <option>Cash</option><option>Bank Transfer</option><option>UPI</option>
            <option>Credit Card</option><option>Cheque</option>
          </select>
        </div>
        <div class="field"><label>Reference / Note</label><input id="p_ref" placeholder="Optional"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn success" onclick="savePayment('${invId}')">Record</button>
    </div>
  `);
  setTimeout(() => $('p_amt').focus(), 100);
}

async function savePayment(invId) {
  const inv = S.invoices.find(x => x.id === invId);
  if (!inv) return;
  const amount = Number($('p_amt').value) || 0;
  if (amount <= 0) return toast('Enter a valid amount');
  inv.payments = inv.payments || [];
  inv.payments.push({
    id: uid(),
    date: $('p_date').value,
    amount,
    method: $('p_method').value,
    reference: $('p_ref').value.trim(),
    recorded: nowStr()
  });
  await saveState();
  closeModal();
  toast('Payment recorded');
  if (currentRoute === 'invoices') renderInvoices();
  else if (currentRoute === 'dashboard') renderDashboard();
  else if (currentRoute === 'payments') renderPayments();
}

function downloadInvoicePDF(id) {
  const inv = S.invoices.find(x => x.id === id);
  if (!inv) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(18);
  doc.setFont(undefined, 'bold');
  doc.text(S.settings.name || 'My Business', 14, 20);

  doc.setFontSize(9);
  doc.setFont(undefined, 'normal');
  let y = 27;
  if (S.settings.address) { doc.text(S.settings.address, 14, y); y += 5; }
  if (S.settings.gstin) { doc.text('GSTIN: ' + S.settings.gstin, 14, y); y += 5; }
  if (S.settings.phone) { doc.text('Phone: ' + S.settings.phone, 14, y); y += 5; }
  if (S.settings.email) { doc.text('Email: ' + S.settings.email, 14, y); y += 5; }

  doc.setFontSize(14);
  doc.setFont(undefined, 'bold');
  doc.text('TAX INVOICE', 140, 20);
  doc.setFontSize(10);
  doc.setFont(undefined, 'normal');
  doc.text(inv.number, 140, 27);
  doc.text('Date: ' + inv.date, 140, 32);
  doc.text('Due: ' + inv.dueDate, 140, 37);

  y = Math.max(y, 42) + 6;

  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text('BILL TO', 14, y);
  doc.setTextColor(0);
  y += 6;
  doc.setFontSize(11);
  doc.setFont(undefined, 'bold');
  doc.text(inv.customerName, 14, y);
  y += 5;
  doc.setFont(undefined, 'normal');
  doc.setFontSize(9);
  if (inv.customerGSTIN) { doc.text('GSTIN: ' + inv.customerGSTIN, 14, y); y += 4; }

  y += 6;

  doc.autoTable({
    startY: y,
    head: [['Item', 'Qty', 'Rate', 'GST %', 'Amount']],
    body: inv.items.map(it => [
      it.name,
      String(it.qty),
      money(it.rate),
      it.gst + '%',
      money(it.qty * it.rate)
    ]),
    theme: 'grid',
    headStyles: { fillColor: [79, 124, 255], fontSize: 9 },
    bodyStyles: { fontSize: 9 },
    columnStyles: {
      0: { cellWidth: 70 },
      1: { halign: 'right' },
      2: { halign: 'right' },
      3: { halign: 'right' },
      4: { halign: 'right' }
    }
  });

  let endY = doc.lastAutoTable.finalY + 8;
  const labelX = 130, valX = 196;

  doc.setFontSize(9);
  doc.text('Subtotal', labelX, endY);
  doc.text(money(inv.subtotal), valX, endY, { align: 'right' });
  endY += 5;
  if (inv.cgst) { doc.text('CGST', labelX, endY); doc.text(money(inv.cgst), valX, endY, { align: 'right' }); endY += 5; }
  if (inv.sgst) { doc.text('SGST', labelX, endY); doc.text(money(inv.sgst), valX, endY, { align: 'right' }); endY += 5; }
  if (inv.igst) { doc.text('IGST', labelX, endY); doc.text(money(inv.igst), valX, endY, { align: 'right' }); endY += 5; }

  doc.setLineWidth(0.3);
  doc.line(labelX, endY, valX, endY);
  endY += 6;
  doc.setFontSize(11);
  doc.setFont(undefined, 'bold');
  doc.text('Total', labelX, endY);
  doc.text(money(inv.total), valX, endY, { align: 'right' });

  if (inv.notes) {
    endY += 14;
    doc.setFontSize(8);
    doc.setFont(undefined, 'normal');
    doc.text('Notes: ' + inv.notes, 14, endY);
  }

  doc.save(inv.number + '.pdf');
  toast('PDF downloaded');
}

function newEstimate() {
  if (S.customers.length === 0) return toast('Add a customer first');
  const custOpts = S.customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const itemOpts = S.items.map(i => `<option value="${i.id}">${esc(i.name)} — ${money(i.rate)}</option>`).join('');

  openModal(`
    <div class="modal-head">
      <h3>New Estimate</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Customer <span class="req">*</span></label><select id="est_cust">${custOpts}</select></div>
        <div class="field"><label>Date</label><input id="est_date" type="date" value="${today()}"></div>
      </div>
      <div style="margin-top:16px;display:flex;align-items:center;justify-content:space-between">
        <label style="font-size:12px;font-weight:600;color:var(--dim)">Line Items</label>

      </div>
      <div id="estLines" style="margin-top:10px"></div>

        <div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:var(--dim)">Subtotal</span><span id="e_sub">₹0.00</span></div>
        <div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:var(--dim)">Tax</span><span id="e_tax">₹0.00</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0 3px;border-top:1px solid var(--line);margin-top:5px;font-weight:700;font-size:15px"><span>Total</span><span id="e_total">₹0.00</span></div>

  `);

  window._estCounter = 0;

function addEstimateLine() {
  const id = 'el_' + (++window._estCounter);
  const wrap = document.createElement('div');
  wrap.id = id;
  wrap.style.cssText = 'display:grid;grid-template-columns:2fr 60px 90px 70px 32px;gap:6px;margin-bottom:6px;align-items:center';
  wrap.innerHTML = `
    <select class="el-item" onchange="pickEstimateItem(this, '${id}')" style="padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12px">
      <option value="">— Select item —</option>${window._itemOpts}
    </select>
    <input class="el-qty" type="number" value="1" min="0" oninput="recalcEstimate()" style="padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12px">
    <input class="el-rate" type="number" value="0" min="0" oninput="recalcEstimate()" style="padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12px">
    <input class="el-gst" type="number" value="18" min="0" oninput="recalcEstimate()" style="padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12px">
    <button class="icon-btn" onclick="this.parentElement.remove();recalcEstimate()">✕</button>
  `;
  $('estLines').appendChild(wrap);
}

function pickEstimateItem(sel, lineId) {
  const line = $(lineId);
  const item = S.items.find(i => i.id === sel.value);
  if (item) {
    line.querySelector('.el-rate').value = item.rate;
    line.querySelector('.el-gst').value = item.gst;
  }
  recalcEstimate();
}

function recalcEstimate() {
  const lines = [];
  document.querySelectorAll('#estLines > div').forEach(d => {
    const sel = d.querySelector('.el-item');
    const qty = Number(d.querySelector('.el-qty').value) || 0;
    const rate = Number(d.querySelector('.el-rate').value) || 0;
    const gst = Number(d.querySelector('.el-gst').value) || 0;
    const itemName = sel.value ? (S.items.find(i => i.id === sel.value)?.name || 'Item') : 'Item';
    lines.push({ itemId: sel.value, name: itemName, qty, rate, gst });
  });
  const custId = $('est_cust')?.value;
  const cust = S.customers.find(c => c.id === custId);
  const calc = calcInvoice(lines, cust?.stateCode || '');
  if ($('e_sub')) $('e_sub').textContent = money(calc.subtotal);
  if ($('e_tax')) $('e_tax').textContent = money(calc.taxTotal);
  if ($('e_total')) $('e_total').textContent = money(calc.total);
}

async function saveEstimate() {
  const custId = $('est_cust').value;
  const cust = S.customers.find(c => c.id === custId);
  if (!cust) return toast('Select a customer');

  const lines = [];
  document.querySelectorAll('#estLines > div').forEach(d => {
    const sel = d.querySelector('.el-item');
    const qty = Number(d.querySelector('.el-qty').value) || 0;
    const rate = Number(d.querySelector('.el-rate').value) || 0;
    if (qty <= 0) return;
    const gst = Number(d.querySelector('.el-gst').value) || 0;
    const itemName = sel.value ? (S.items.find(i => i.id === sel.value)?.name || 'Item') : 'Custom item';
    lines.push({ itemId: sel.value, name: itemName, qty, rate, gst });
  });

  if (lines.length === 0) return toast('Add at least one line item');

  const calc = calcInvoice(lines, cust.stateCode);
  const estNum = S.settings.estPrefix + String(S.settings.estCounter).padStart(4, '0');

  S.estimates.push({
    id: uid(), number: estNum,
    date: $('est_date').value,
    customerId: cust.id, customerName: cust.name,
    items: lines,
    subtotal: calc.subtotal, cgst: calc.cgst, sgst: calc.sgst, igst: calc.igst,
    total: calc.total,
    converted: false, created: nowStr()
  });

  S.settings.estCounter++;
  await saveState();
  closeModal();
  toast('Estimate ' + estNum + ' saved');
  renderEstimates();
}

async function convertEstimate(id) {
  const est = S.estimates.find(x => x.id === id);
  if (!est) return;
  if (!confirm('Convert estimate ' + est.number + ' to invoice?')) return;

  const cust = S.customers.find(c => c.id === est.customerId);
  const calc = calcInvoice(est.items, cust?.stateCode || '');
  const invNum = S.settings.invPrefix + String(S.settings.invCounter).padStart(4, '0');

  S.invoices.push({
    id: uid(), number: invNum,
    date: today(), dueDate: today(),
    customerId: est.customerId, customerName: est.customerName,
    customerGSTIN: cust?.gstin || '',
    customerStateCode: cust?.stateCode || '',
    items: est.items,
    subtotal: calc.subtotal, cgst: calc.cgst, sgst: calc.sgst, igst: calc.igst,
    total: calc.total,
    notes: 'Converted from ' + est.number,
    payments: [], created: nowStr()
  });

  S.settings.invCounter++;
  est.converted = true;
  est.convertedTo = invNum;
  await saveState();
  toast('Converted to ' + invNum);
  navigate('invoices');
}

async function deleteEstimate(id) {
  if (!confirm('Delete this estimate?')) return;
  S.estimates = S.estimates.filter(e => e.id !== id);
  await saveState();
  toast('Estimate deleted');
  renderEstimates();
}

}

function newExpense() {
  const cats = ['Rent', 'Utilities', 'Salaries', 'Marketing', 'Travel', 'Office Supplies', 'Software', 'Professional Fees', 'Maintenance', 'Insurance', 'Other'];
  openModal(`
    <div class="modal-head">
      <h3>New Expense</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Date</label><input id="ex_date" type="date" value="${today()}"></div>
        <div class="field"><label>Category</label>
          <select id="ex_cat">${cats.map(c => `<option>${c}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Amount</label><input id="ex_amt" type="number" step="0.01" min="0"></div>
        <div class="field"><label>Description</label><input id="ex_desc" placeholder="What was it for?"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveExpense()">Save</button>
    </div>
  `);
  setTimeout(() => $('ex_amt').focus(), 100);
}

async function saveExpense() {
  const amount = Number($('ex_amt').value) || 0;
  if (amount <= 0) return toast('Enter a valid amount');
  S.expenses.push({
    id: uid(),
    date: $('ex_date').value,
    category: $('ex_cat').value,
    amount,
    description: $('ex_desc').value.trim(),
    created: nowStr()
  });
  await saveState();
  closeModal();
  toast('Expense added');
  renderExpenses();
}

async function deleteExpense(id) {
  if (!confirm('Delete this expense?')) return;
  S.expenses = S.expenses.filter(e => e.id !== id);
  await saveState();
  toast('Expense deleted');
  renderExpenses();
}

/* ══════════════════════════════════════════
   VENDOR BILLS
   ══════════════════════════════════════════ */
function renderBills() {
  $('topActions').innerHTML = `<button class="act" onclick="newBill()">+ New Bill</button>`;
  const list = [...S.bills].reverse();
  $('content').innerHTML = `
    <div class="card">
      <h3>Vendor Bills <span class="hint">${S.bills.length} total</span></h3>
      ${list.length === 0
        ? `<div class="empty"><span class="big">▥</span>No vendor bills yet.</div>`
        : `<div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Bill #</th><th>Date</th><th>Vendor</th><th class="num">Total</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${list.map(b => `<tr>
                <td class="name">${esc(b.number)}</td>
                <td class="sm">${b.date}</td>
                <td>${esc(b.vendorName)}</td>
                <td class="num">${money(b.total)}</td>
                <td><span class="badge ${b.paid ? 'g' : 'r'}">${b.paid ? 'paid' : 'unpaid'}</span></td>
                <td><div class="row-act">
                  ${!b.paid ? `<button class="icon-btn" onclick="markBillPaid('${b.id}')" title="Mark paid">✓</button>` : ''}
                  <button class="icon-btn" onclick="deleteBill('${b.id}')">✕</button>
                </div></td>
              </tr>`).join('')}
            </tbody>
          </table></div>`}
    </div>
  `;
}

function newBill() {
  if (S.vendors.length === 0) return toast('Add a vendor first');
  const vendOpts = S.vendors.map(v => `<option value="${v.id}">${esc(v.name)}</option>`).join('');
  openModal(`
    <div class="modal-head">
      <h3>New Vendor Bill</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Vendor</label><select id="b_vend">${vendOpts}</select></div>
        <div class="field"><label>Date</label><input id="b_date" type="date" value="${today()}"></div>
        <div class="field"><label>Bill Number</label><input id="b_num" placeholder="Vendor's bill #"></div>
        <div class="field"><label>Amount</label><input id="b_amt" type="number" step="0.01" min="0"></div>
        <div class="field" style="grid-column:1/-1"><label>Description</label><input id="b_desc"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveBill()">Save Bill</button>
    </div>
  `);
  setTimeout(() => $('b_amt').focus(), 100);
}

async function saveBill() {
  const amt = Number($('b_amt').value) || 0;
  if (amt <= 0) return toast('Enter a valid amount');
  const vid = $('b_vend').value;
  const v = S.vendors.find(x => x.id === vid);
  S.bills.push({
    id: uid(),
    number: $('b_num').value.trim() || 'BILL-' + Date.now().toString(36).slice(-5).toUpperCase(),
    date: $('b_date').value,
    vendorId: vid, vendorName: v?.name || '',
    description: $('b_desc').value.trim(),
    total: amt,
    paid: false,
    created: nowStr()
  });
  await saveState();
  closeModal();
  toast('Bill added');
  renderBills();
}

async function markBillPaid(id) {
  const b = S.bills.find(x => x.id === id);
  if (!b) return;
  b.paid = true;
  b.paidDate = today();
  await saveState();
  toast('Marked as paid');
  renderBills();
}

async function deleteBill(id) {
  if (!confirm('Delete this bill?')) return;
  S.bills = S.bills.filter(b => b.id !== id);
  await saveState();
  toast('Bill deleted');
  renderBills();
}

/* ══════════════════════════════════════════
   REPORTS
   ══════════════════════════════════════════ */
function renderReports() {
  $('topActions').innerHTML = '';
  const totalSales = S.invoices.reduce((s, i) => s + i.total, 0);
  const totalPurchases = S.bills.reduce((s, b) => s + b.total, 0);
  const totalExpenses = S.expenses.reduce((s, e) => s + e.amount, 0);
  const grossProfit = totalSales - totalPurchases;
  const netProfit = grossProfit - totalExpenses;

  const gstOut = S.invoices.reduce((s, i) => s + i.cgst + i.sgst + i.igst, 0);
  const gstIn = 0; // simplified

  const aging = { '0-30': 0, '31-60': 0, '61-90': 0, '90+': 0 };
  S.invoices.forEach(inv => {
    const bal = invoiceBalance(inv);
    if (bal <= 0) return;
    const days = Math.ceil((new Date() - new Date(inv.date)) / 86400000);
    if (days <= 30) aging['0-30'] += bal;
    else if (days <= 60) aging['31-60'] += bal;
    else if (days <= 90) aging['61-90'] += bal;
    else aging['90+'] += bal;
  });

  $('content').innerHTML = `
    <div class="card">
      <h3>📊 Profit & Loss</h3>
      <div style="font-size:13px">
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>Revenue</span><span style="color:var(--green);font-weight:600">${money(totalSales)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>Cost of Purchases</span><span style="color:var(--red)">− ${money(totalPurchases)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600"><span>Gross Profit</span><span>${money(grossProfit)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>Operating Expenses</span><span style="color:var(--red)">− ${money(totalExpenses)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:11px 0;font-weight:700;font-size:15px"><span>Net Profit</span><span style="color:${netProfit >= 0 ? 'var(--green)' : 'var(--red)'}">${money(netProfit)}</span></div>
      </div>
    </div>

    <div class="card">
      <h3>📈 Receivables Aging</h3>
      <div class="tbl-wrap"><table class="tbl" style="min-width:auto">
        <thead><tr><th>Age</th><th class="num">Amount</th></tr></thead>
        <tbody>
          <tr><td>0–30 days</td><td class="num" style="color:var(--green)">${money(aging['0-30'])}</td></tr>
          <tr><td>31–60 days</td><td class="num" style="color:var(--amber)">${money(aging['31-60'])}</td></tr>
          <tr><td>61–90 days</td><td class="num" style="color:var(--red)">${money(aging['61-90'])}</td></tr>
          <tr><td>90+ days</td><td class="num" style="color:var(--red)">${money(aging['90+'])}</td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="card">
      <h3>🧾 GST Summary</h3>
      <div style="font-size:13px">
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>GST Collected (Output)</span><span>${money(gstOut)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>GST Paid (Input)</span><span>${money(gstIn)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:11px 0;font-weight:700"><span>Net GST Payable</span><span style="color:var(--amber)">${money(gstOut - gstIn)}</span></div>
      </div>
    </div>

    <div class="card">
      <h3>📤 Export</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" onclick="exportInvoicesCSV()">📊 Invoices CSV</button>
        <button class="btn ghost" onclick="exportGSTR1()">🧾 GSTR-1 CSV</button>
        <button class="btn ghost" onclick="exportAllJSON()">💾 Full Backup</button>
      </div>
    </div>
  `;
}

function exportInvoicesCSV() {
  let csv = 'Invoice,Date,Customer,Subtotal,CGST,SGST,IGST,Total,Status\n';
  S.invoices.forEach(i => {
    csv += `"${i.number}","${i.date}","${i.customerName}",${i.subtotal.toFixed(2)},${i.cgst.toFixed(2)},${i.sgst.toFixed(2)},${i.igst.toFixed(2)},${i.total.toFixed(2)},"${invoiceStatus(i)}"\n`;
  });
  download(new Blob([csv], { type: 'text/csv' }), 'invoices_' + today() + '.csv');
  toast('CSV exported');
}

function exportGSTR1() {
  const taxInvoices = S.invoices.filter(i => i.cgst || i.sgst || i.igst);
  let csv = 'GSTIN,Invoice,Date,Customer,Taxable,CGST,SGST,IGST,Total\n';
  taxInvoices.forEach(i => {
    csv += `"${S.settings.gstin}","${i.number}","${i.date}","${i.customerName}",${i.subtotal.toFixed(2)},${i.cgst.toFixed(2)},${i.sgst.toFixed(2)},${i.igst.toFixed(2)},${i.total.toFixed(2)}\n`;
  });
  download(new Blob([csv], { type: 'text/csv' }), 'GSTR1_' + today() + '.csv');
  toast('GSTR-1 exported');
}

function exportAllJSON() {
  download(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), 'ledger_backup_' + today() + '.json');
  toast('Backup downloaded');
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ══════════════════════════════════════════
   SETTINGS
   ══════════════════════════════════════════ */
function renderSettings() {
  $('topActions').innerHTML = '';
  const s = S.settings;
  $('content').innerHTML = `
    <div class="card">
      <h3>Business Details</h3>
      <div class="form-grid">
        <div class="field"><label>Business Name</label><input id="s_name" value="${esc(s.name)}"></div>
        <div class="field"><label>GSTIN</label><input id="s_gstin" value="${esc(s.gstin)}"></div>
        <div class="field"><label>Phone</label><input id="s_phone" value="${esc(s.phone)}"></div>
        <div class="field"><label>Email</label><input id="s_email" value="${esc(s.email)}"></div>
        <div class="field" style="grid-column:1/-1"><label>Address</label><input id="s_addr" value="${esc(s.address)}"></div>
        <div class="field"><label>State Code (for GST)</label><input id="s_state" value="${esc(s.stateCode)}" placeholder="e.g. 27"></div>
        <div class="field"><label>Currency Symbol</label><input id="s_curr" value="${esc(s.currency)}"></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn primary" onclick="saveSettings()">Save Settings</button>
      </div>
    </div>

    <div class="card">
      <h3>Invoice Numbering</h3>
      <div class="form-grid">
        <div class="field"><label>Invoice Prefix</label><input id="s_invpre" value="${esc(s.invPrefix)}"></div>
        <div class="field"><label>Next Invoice #</label><input id="s_invcnt" type="number" value="${s.invCounter}"></div>
        <div class="field"><label>Estimate Prefix</label><input id="s_estpre" value="${esc(s.estPrefix)}"></div>
        <div class="field"><label>Next Estimate #</label><input id="s_estcnt" type="number" value="${s.estCounter}"></div>
      </div>
      <div style="margin-top:14px">
        <button class="btn primary" onclick="saveSettings()">Save</button>
      </div>
    </div>

    <div class="card">
      <h3>Data</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" onclick="exportAllJSON()">💾 Export Backup</button>
        <button class="btn ghost" onclick="triggerImport()">📥 Import Backup</button>
        <button class="btn danger" onclick="resetAll()">🗑 Delete All Data</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)">
      <p style="margin-top:12px;font-size:11px;color:var(--dim);line-height:1.6">
        All data is stored privately in your browser. Nothing is sent to any server. Export regularly to back up.
      </p>
    </div>

    <div class="card">
      <h3>About</h3>
      <p style="font-size:12px;color:var(--dim);line-height:1.7">
        <b style="color:var(--text)">Ledger</b> — a simple, offline business manager.<br>
        Handles invoices, estimates, payments, expenses, customers, vendors, items, and reports.<br>
        No account. No server. No ads. Everything stays on your device.
      </p>
    </div>
  `;
}

async function saveSettings() {
  Object.assign(S.settings, {
    name: $('s_name').value.trim() || 'My Business',
    gstin: $('s_gstin').value.trim(),
    phone: $('s_phone').value.trim(),
    email: $('s_email').value.trim(),
    address: $('s_addr').value.trim(),
    stateCode: $('s_state').value.trim(),
    currency: $('s_curr').value.trim() || '₹',
    invPrefix: $('s_invpre').value.trim() || 'INV-',
    invCounter: Number($('s_invcnt').value) || 1,
    estPrefix: $('s_estpre').value.trim() || 'EST-',
    estCounter: Number($('s_estcnt').value) || 1
  });
  await saveState();
  toast('Settings saved');
}

function triggerImport() {
  $('importFile').click();
}

async function importBackup(e) {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const text = await f.text();
    const data = JSON.parse(text);
    if (!confirm('This will replace all current data. Continue?')) return;
    Object.assign(S, data);
    await saveState();
    toast('Backup imported');
    navigate('dashboard');
  } catch (err) {
    toast('Invalid backup file');
  }
}

async function resetAll() {
  if (!confirm('Delete ALL data permanently? This cannot be undone.')) return;
  if (!confirm('Are you absolutely sure?')) return;
  S.customers = []; S.vendors = []; S.items = [];
  S.invoices = []; S.estimates = []; S.payments = [];
  S.expenses = []; S.bills = [];
  S.settings = {
    name: 'My Business', gstin: '', address: '', phone: '', email: '',
    stateCode: '27', invPrefix: 'INV-', invCounter: 1,
    estPrefix: 'EST-', estCounter: 1, currency: '₹'
  };
  await saveState();
  toast('All data cleared');
  navigate('dashboard');
}

/* ══════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════ */
(async function init() {
  try {
    await loadState();
  } catch (e) {
    console.warn('IndexedDB unavailable, using memory only', e);
  }
  navigate('dashboard');
})();

window.viewInvoice = viewInvoice;
window.deleteInvoice = deleteInvoice;

window.savePayment = savePayment;
window.downloadInvoicePDF = downloadInvoicePDF;

window.pickEstimateItem = pickEstimateItem;
window.recalcEstimate = recalcEstimate;
window.saveEstimate = saveEstimate;
window.convertEstimate = convertEstimate;
window.deleteEstimate = deleteEstimate;
window.newExpense = newExpense;
window.saveExpense = saveExpense;
window.deleteExpense = deleteExpense;
window.newBill = newBill;
window.saveBill = saveBill;
window.markBillPaid = markBillPaid;
window.deleteBill = deleteBill;
window.saveSettings = saveSettings;
window.triggerImport = triggerImport;
window.importBackup = importBackup;
window.resetAll = resetAll;
window.exportInvoicesCSV = exportInvoicesCSV;
window.exportGSTR1 = exportGSTR1;
window.exportAllJSON = exportAllJSON;
</script>
